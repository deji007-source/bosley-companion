name: Build Bosley Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: bosley-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies and build
        run: |
          npm install
          npm run build

      - name: Use the shared production Bosley interface for Android
        run: |
          test -s index.html
          cp index.html dist/index.html
          grep -q 'id="side-dock"' dist/index.html
          grep -q 'id="launch"' dist/index.html

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          python3 scripts/install-android-overlay.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Bosley-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
