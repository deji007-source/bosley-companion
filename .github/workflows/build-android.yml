name: Build Bosley Android APK
run-name: Bosley Android Build (${{ github.sha }})

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - 'scripts/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

concurrency:
  group: bosley-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies and build
        run: |
          npm install
          npm run test:companion
          npm run build

      - name: Use the shared production Bosley interface for Android
        run: |
          test -s index.html
          cp index.html dist/index.html
          grep -q 'id="side-dock"' dist/index.html
          grep -q 'id="launch"' dist/index.html

      - name: Install Capacitor Android tooling
        run: npm install --no-save @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          python3 scripts/install-android-overlay.py
          python3 scripts/prepare-android-direct-install.py
          grep -Fq 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.SYSTEM_ALERT_WINDOW' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:name=".BosleyOverlayService"' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'BIND_ACCESSIBILITY_SERVICE' android/app/src/main/AndroidManifest.xml
          ! grep -Fq 'BosleyTargetAccessibilityService' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android:foregroundServiceType="specialUse|mediaProjection"' android/app/src/main/AndroidManifest.xml
          grep -Fq 'ACTION_CAPTURE_START' android/app/src/main/java/com/bosley/companion/BosleyOverlayService.java
          grep -Fq 'registerCallback(new MediaProjection.Callback()' android/app/src/main/java/com/bosley/companion/BosleyOverlayPlugin.java
          echo "Floating companion, visual guide and user-consented one-shot screen capture declarations verified."

      - name: Generate Bosley launcher icon
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/generate-app-icons.py

      - name: Configure release signing when repository secrets are provided
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            set -euo pipefail
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bosley-release.keystore"
            test -s "$RUNNER_TEMP/bosley-release.keystore"
            keytool -list -keystore "$RUNNER_TEMP/bosley-release.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/bosley-release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          if not path.is_file():
              raise SystemExit("Expected android/app/build.gradle was not generated.")

          source = path.read_text()
          if "signingConfigs" not in source:
              android_match = re.search(r"\bandroid\s*\{", source)
              if not android_match:
                  raise SystemExit("Could not locate the Android Gradle configuration block.")
              signing = """android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
          """
              source = source[:android_match.start()] + signing + source[android_match.end():]
          elif "signingConfigs.release" not in source:
              raise SystemExit("A signingConfigs block already exists but is not the expected Bosley release configuration.")

          build_types = re.search(r"buildTypes\s*\{", source)
          if not build_types:
              raise SystemExit("Could not locate the Android buildTypes block.")
          release_block = re.search(r"release\s*\{", source[build_types.end():])
          if not release_block:
              raise SystemExit("Could not locate the release build type.")
          release_start = build_types.end() + release_block.end()
          release_body = source[release_start:]
          if "signingConfig" in release_body.split("}", 1)[0]:
              if "signingConfigs.release" not in release_body.split("}", 1)[0]:
                  raise SystemExit("The release build type has a conflicting signing configuration.")
          else:
              source = source[:release_start] + "\n            signingConfig signingConfigs.release" + source[release_start:]

          path.write_text(source)
          print("Configured the release variant to use the validated upload keystore.")
          PY
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets are not configured. Only a debug APK will be produced; it is for development testing, not a Play Store release."
          fi

      - name: Build Android package
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Verify Android package signatures
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
            AAB="android/app/build/outputs/bundle/release/app-release.aab"
            test -s "$APK"
            test -s "$AAB"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -n "$APKSIGNER"
            "$APKSIGNER" verify --verbose --print-certs "$APK"
            jarsigner -verify "$AAB"
            echo "Release APK and Android App Bundle signature checks passed."
          else
            APK="android/app/build/outputs/apk/debug/app-debug.apk"
            test -s "$APK"
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            test -n "$APKSIGNER"
            "$APKSIGNER" verify --verbose "$APK"
            echo "Debug APK signature is valid; this is not a Play release."
          fi

      - name: Upload signed release APK and Play bundle
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Bosley-Android-Signed-Release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload development debug APK
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Bosley-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
