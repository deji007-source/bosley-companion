
name: Build Bosley Windows App

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"
      - "index.html"
      - "package.json"
      - "src/**"
      - "src/styles.css"
      - "vite.config.ts"
      - "tsconfig*.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies and verify production build
        run: |
          npm install
          npm run build

      - name: Generate Bosley desktop app
        shell: bash
        run: |
          mkdir -p desktop

          cat > desktop/package.json <<'PACKAGE_EOF'
          {
            "name": "bosley-companion-desktop",
            "version": "1.0.2",
            "description": "Bosley floating desktop companion",
            "main": "main.cjs",
            "scripts": {
              "dist": "electron-builder --win nsis"
            },
            "devDependencies": {
              "electron": "^35.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.bosley.companion",
              "productName": "Bosley Companion",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.cjs",
                "preload.cjs",
                "bubble.html"
              ],
              "win": {
                "target": "nsis"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true
              }
            }
          }
          PACKAGE_EOF

          cat > desktop/main.cjs <<'MAIN_EOF'
          const { app, BrowserWindow, ipcMain, screen, shell, dialog } = require('electron');
          const path = require('path');
          const fs = require('fs');
          const { spawn } = require('child_process');

          const SITE = 'https://bosley-companion.vercel.app/';
          let bubble = null;
          let panel = null;
          let widgetAppearance = { size: 'default', edge: 'soft', border: 'thin' };
          const WIDGET_SIZES = {
            compact: { width: 104, height: 68 },
            default: { width: 120, height: 76 },
            wide: { width: 140, height: 84 }
          };

          function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;'
            })[character]);
          }

          function positionWindows() {
            const area = screen.getPrimaryDisplay().workArea;

            if (bubble && !bubble.isDestroyed()) {
              const dimensions = WIDGET_SIZES[widgetAppearance.size] || WIDGET_SIZES.default;
              const bubbleWidth = dimensions.width;
              const bubbleHeight = dimensions.height;

              bubble.setBounds({
                x: area.x + Math.round((area.width - bubbleWidth) / 2),
                y: area.y + 12,
                width: bubbleWidth,
                height: bubbleHeight
              });

              bubble.setAlwaysOnTop(true, 'screen-saver');
            }

            if (panel && !panel.isDestroyed() && panel.isVisible()) {
              const width = Math.min(440, area.width - 24);
              const height = Math.max(320, Math.min(560, area.height - 110));
              const x = area.x + Math.round((area.width - width) / 2);
              const y = Math.min(
                area.y + 98,
                area.y + area.height - height
              );

              panel.setBounds({ x, y, width, height });
            }
          }

          function showLoadError(message) {
            if (!panel || panel.isDestroyed()) return;

            const safeMessage = escapeHtml(message);

            const html = `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Bosley — Connection issue</title>
            <style>
              * { box-sizing: border-box; }
              body {
                margin: 0;
                background: #101010;
                color: #f7f7f7;
                font: 15px system-ui, Segoe UI, Arial, sans-serif;
                padding: 34px;
                display: grid;
                place-items: center;
                min-height: 100vh;
              }
              main { max-width: 330px; }
              h1 { font-size: 23px; margin: 0 0 12px; }
              p {
                line-height: 1.6;
                color: #c8c8c8;
                overflow-wrap: anywhere;
              }
              button {
                border: 0;
                border-radius: 12px;
                padding: 12px 17px;
                background: #f5f5f5;
                color: #111;
                font-weight: 650;
                cursor: pointer;
                margin: 8px 8px 0 0;
              }
              button.secondary {
                background: #282828;
                color: #fff;
                border: 1px solid #454545;
              }
              small {
                display: block;
                color: #888;
                margin-top: 20px;
                line-height: 1.5;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>Bosley couldn't load</h1>
              <p>The desktop panel couldn't display the website.</p>
              <p><strong>Details:</strong> ${safeMessage}</p>
              <button onclick="location.href='${SITE}'">Try again</button>
              <button class="secondary" onclick="window.open('${SITE}','_blank')">
                Open in browser
              </button>
              <small>
                Your Bosley account and Supabase data have not been changed by this message.
              </small>
            </main>
          </body>
          </html>`;

            panel.loadURL(
              'data:text/html;charset=utf-8,' + encodeURIComponent(html)
            ).catch(() => {});
          }

          function createBubble() {
            const dimensions = WIDGET_SIZES[widgetAppearance.size] || WIDGET_SIZES.default;
            bubble = new BrowserWindow({
              width: dimensions.width,
              height: dimensions.height,
              frame: false,
              transparent: true,
              resizable: false,
              movable: true,
              alwaysOnTop: true,
              skipTaskbar: true,
              hasShadow: false,
              backgroundColor: '#00000000',
              webPreferences: {
                preload: path.join(__dirname, 'preload.cjs'),
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            bubble.setAlwaysOnTop(true, 'screen-saver');
            bubble.loadFile(path.join(__dirname, 'bubble.html')).then(() => {
              bubble.webContents.send('bosley:widget-appearance', widgetAppearance);
            }).catch(error => console.error('Bubble load failed:', error.message));
            bubble.on('closed', () => {
              bubble = null;
            });
          }

          function createPanel() {
            panel = new BrowserWindow({
              width: 440,
              height: 560,
              minWidth: 360,
              minHeight: 320,
              resizable: true,
              show: false,
              backgroundColor: '#000000',
              title: 'Bosley Companion',
              autoHideMenuBar: true,
              alwaysOnTop: true,
              webPreferences: {
                preload: path.join(__dirname, 'preload.cjs'),
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            panel.setAlwaysOnTop(true);

            panel.webContents.on(
              'did-fail-load',
              (_event, code, description, failedUrl, isMainFrame) => {
                if (isMainFrame && !String(failedUrl).startsWith('data:')) {
                  showLoadError(
                    `${code}: ${description} (${failedUrl})`
                  );
                }
              }
            );

            panel.webContents.on(
              'render-process-gone',
              (_event, details) => {
                showLoadError(
                  `The page process stopped (${details.reason || 'unknown reason'}).`
                );
              }
            );

            panel.webContents.on('did-finish-load', () => {
              console.log(
                'Bosley page loaded:',
                panel && !panel.isDestroyed()
                  ? panel.webContents.getURL()
                  : 'closed'
              );
            });

            panel.webContents.setWindowOpenHandler(({ url }) => {
              let target;
              try { target = new URL(url); } catch {
                return { action: 'deny' };
              }

              if (target.protocol !== 'https:') {
                return { action: 'deny' };
              }

              // Do not let arbitrary page content open links silently.
              dialog.showMessageBox(panel, {
                type: 'question',
                buttons: ['Cancel', 'Open link'],
                defaultId: 0,
                cancelId: 0,
                title: 'Bosley Companion',
                message: 'Allow this page to open an external link?',
                detail: target.href
              }).then(choice => {
                if (choice.response === 1) {
                  return shell.openExternal(target.href);
                }
              }).catch(error => {
                console.error('External link request failed:', error.message);
              });

              return { action: 'deny' };
            });

            panel.loadURL(SITE).catch(error => {
              showLoadError(error.message);
            });

            panel.on('close', event => {
              if (!app.isQuitting) {
                event.preventDefault();
                panel.hide();
              }
            });

            panel.on('closed', () => {
              panel = null;
            });
          }

          function togglePanel() {
            if (!panel || panel.isDestroyed()) {
              createPanel();
            }

            if (panel.isVisible()) {
              panel.hide();
            } else {
              positionWindows();
              panel.show();
              panel.focus();
              bubble?.setAlwaysOnTop(true, 'screen-saver');
            }
          }

          function isTrustedPanelSender(event) {
            const frameUrl = event.senderFrame?.url || '';
            try {
              return new URL(frameUrl).origin === new URL(SITE).origin;
            } catch {
              return false;
            }
          }

          ipcMain.handle('bosley:capabilities', event => {
            if (!isTrustedPanelSender(event)) {
              throw new Error('Untrusted Bosley panel origin');
            }
            return {
              platform: process.platform,
              desktopBridge: true,
              actions: ['get_desktop_info', 'open_external_url', 'set_widget_appearance', 'launch_app']
            };
          });

          ipcMain.handle('bosley:request', async (event, request) => {
            if (!isTrustedPanelSender(event)) {
              throw new Error('Untrusted Bosley panel origin');
            }
            if (!request || typeof request.action !== 'string') {
              throw new Error('Invalid desktop request');
            }
            if (request.action === 'get_desktop_info') {
              const display = screen.getPrimaryDisplay();
              return {
                ok: true,
                platform: process.platform,
                appVersion: app.getVersion(),
                display: {
                  width: display.workAreaSize.width,
                  height: display.workAreaSize.height
                }
              };
            }
            if (request.action === 'set_widget_appearance') {
              const payload = request.payload || {};
              const allowedSizes = ['compact', 'default', 'wide'];
              const allowedEdges = ['soft', 'balanced', 'sharp'];
              const allowedBorders = ['thin', 'medium', 'bold'];
              if (!allowedSizes.includes(payload.size) ||
                  !allowedEdges.includes(payload.edge) ||
                  !allowedBorders.includes(payload.border)) {
                throw new Error('Invalid widget appearance settings');
              }
              widgetAppearance = {
                size: payload.size,
                edge: payload.edge,
                border: payload.border
              };
              const dimensions = WIDGET_SIZES[widgetAppearance.size];
              if (bubble && !bubble.isDestroyed()) {
                const area = screen.getPrimaryDisplay().workArea;
                bubble.setBounds({
                  x: area.x + Math.round((area.width - dimensions.width) / 2),
                  y: area.y + 12,
                  width: dimensions.width,
                  height: dimensions.height
                });
                bubble.webContents.send('bosley:widget-appearance', widgetAppearance);
                bubble.setAlwaysOnTop(true, 'screen-saver');
              }
              return { ok: true, appearance: widgetAppearance };
            }
            if (request.action === 'launch_app') {
              const appId = String(request.payload?.app || '').toLowerCase();
              // Fixed allowlist only: never accept executable paths or shell commands from the web page.
              if (process.platform !== 'win32') {
                throw new Error('App launching is currently supported by the Windows desktop build only.');
              }
              if (appId !== 'chrome') {
                throw new Error('This first app-launch action supports Chrome only.');
              }
              const choice = await dialog.showMessageBox(panel, {
                type: 'question',
                buttons: ['Cancel', 'Open Chrome'],
                defaultId: 0,
                cancelId: 0,
                title: 'Bosley Companion',
                message: 'Allow Bosley to launch Google Chrome?',
                detail: 'Bosley can only launch the approved Chrome application. No command or executable path was supplied by chat.'
              });
              if (choice.response !== 1) return { ok: false, cancelled: true };
              const candidates = [
                path.join(process.env.PROGRAMFILES || 'C:\\Program Files', 'Google', 'Chrome', 'Application', 'chrome.exe'),
                path.join(process.env['PROGRAMFILES(X86)'] || 'C:\\Program Files (x86)', 'Google', 'Chrome', 'Application', 'chrome.exe'),
                path.join(process.env.LOCALAPPDATA || '', 'Google', 'Chrome', 'Application', 'chrome.exe')
              ];
              const executable = candidates.find(candidate => candidate && fs.existsSync(candidate));
              if (!executable) throw new Error('Chrome was not found in its standard Windows installation folders.');
              const child = spawn(executable, [], { detached: true, stdio: 'ignore', windowsHide: true });
              child.on('error', () => {});
              child.unref();
              return { ok: true, launched: 'chrome' };
            }
            if (request.action === 'open_external_url') {
              const rawUrl = String(request.payload?.url || '');
              let target;
              try { target = new URL(rawUrl); } catch {
                throw new Error('A valid HTTPS URL is required');
              }
              if (target.protocol !== 'https:') {
                throw new Error('Only HTTPS links can be opened');
              }
              const choice = await dialog.showMessageBox(panel, {
                type: 'question',
                buttons: ['Cancel', 'Open link'],
                defaultId: 0,
                cancelId: 0,
                title: 'Bosley Companion',
                message: 'Allow Bosley to open this external link?',
                detail: target.href
              });
              if (choice.response !== 1) return { ok: false, cancelled: true };
              await shell.openExternal(target.href);
              return { ok: true, opened: true };
            }
            throw new Error('Desktop action is not allowlisted');
          });

          app.whenReady().then(() => {
            createBubble();
            createPanel();
            positionWindows();

            ipcMain.on('toggle-panel', togglePanel);

            screen.on('display-metrics-changed', positionWindows);
            screen.on('display-added', positionWindows);
            screen.on('display-removed', positionWindows);
          });

          app.on('before-quit', () => {
            app.isQuitting = true;
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });
          MAIN_EOF

          cat > desktop/preload.cjs <<'PRELOAD_EOF'
          const { contextBridge, ipcRenderer } = require('electron');

          const desktopBridge = Object.freeze({
            togglePanel: () => ipcRenderer.send('toggle-panel'),
            getCapabilities: () => ipcRenderer.invoke('bosley:capabilities'),
            request: request => ipcRenderer.invoke('bosley:request', request),
            onWidgetAppearance: callback => {
              if (typeof callback !== 'function') return () => {};
              const listener = (_event, appearance) => callback(appearance);
              ipcRenderer.on('bosley:widget-appearance', listener);
              return () => ipcRenderer.removeListener('bosley:widget-appearance', listener);
            }
          });

          contextBridge.exposeInMainWorld('bosleyDesktop', desktopBridge);
          contextBridge.exposeInMainWorld('BosleyDesktop', desktopBridge);
          PRELOAD_EOF

          cat > desktop/bubble.html <<'BUBBLE_EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">

            <style>
              * {
                box-sizing: border-box;
              }

              html,
              body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
              }

              body {
                display: grid;
                place-items: center;
                -webkit-app-region: drag;
              }

              button {
                width: 108px;
                height: 64px;
                padding: 5px;
                border: 1px solid #fff;
                border-radius: 14px;
                background: #000;
                cursor: pointer;
                display: grid;
                place-items: center;
                -webkit-app-region: no-drag;
                transition: border-color 120ms ease;
              }

              button {
                border-radius: var(--widget-radius, 14px);
                border-width: var(--widget-border-width, 1px);
              }

              button:hover {
                border-color: #fff;
              }

              button:focus-visible {
                outline: 2px solid #fff;
                outline-offset: 2px;
              }

              svg {
                width: 94px;
                height: 52px;
                display: block;
              }
            </style>
          </head>

          <body>
            <button
              aria-label="Open Bosley chat"
              title="Open Bosley"
            >
              <svg
                viewBox="0 0 108 64"
                role="img"
                aria-label="Bosley incognito fedora with two white vertical eyes"
              >
                <path d="M31 28 L42 7 Q44 4 48 7 L54 11 L61 7 Q65 4 67 8 L78 28 Z"
                  fill="#050505" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M36 21 Q54 23 73 21 L78 28 L31 28 Z"
                  fill="#171717" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
                <path d="M8 34 Q19 27 40 27 L68 27 Q89 27 100 34 Q79 40 54 40 Q29 40 8 34 Z"
                  fill="#050505" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M39 30 Q54 32 69 30" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
                <rect x="39" y="34" width="7" height="18" rx="3.5" fill="#fff"/>
                <rect x="62" y="34" width="7" height="18" rx="3.5" fill="#fff"/>
              </svg>
            </button>

            <script>
              const button = document.querySelector('button');
              const sizes = {
                compact: { width: 92, height: 56 },
                default: { width: 108, height: 64 },
                wide: { width: 128, height: 72 }
              };
              function applyAppearance(value) {
                if (!value) return;
                const size = sizes[value.size] || sizes.default;
                document.documentElement.style.setProperty('--widget-radius',
                  ({ soft: '24px', balanced: '18px', sharp: '10px' })[value.edge] || '24px');
                document.documentElement.style.setProperty('--widget-border-width',
                  ({ thin: '1px', medium: '2px', bold: '3px' })[value.border] || '1px');
                button.style.width = size.width + 'px';
                button.style.height = size.height + 'px';
                document.querySelector('svg').style.width = Math.max(72, size.width - 14) + 'px';
                document.querySelector('svg').style.height = Math.max(42, size.height - 12) + 'px';
              }
              if (window.bosleyDesktop.onWidgetAppearance) {
                window.bosleyDesktop.onWidgetAppearance(applyAppearance);
              }
              document.querySelector('button').addEventListener('click', () => {
                window.bosleyDesktop.togglePanel();
              });
            </script>
          </body>
          </html>
          BUBBLE_EOF

      - name: Verify generated desktop bridge before packaging
        shell: bash
        run: |
          test -s desktop/main.cjs
          test -s desktop/preload.cjs
          test -s desktop/bubble.html
          grep -Fq "bosley:capabilities" desktop/main.cjs
          grep -Fq "bosley:request" desktop/main.cjs
          grep -Fq "get_desktop_info" desktop/main.cjs
          grep -Fq "open_external_url" desktop/main.cjs
          grep -Fq "set_widget_appearance" desktop/main.cjs
          grep -Fq "onWidgetAppearance" desktop/preload.cjs
          grep -Fq "contextIsolation: true" desktop/main.cjs
          grep -Fq "nodeIntegration: false" desktop/main.cjs
          grep -Fq "sandbox: true" desktop/main.cjs
          grep -Fq "getCapabilities" desktop/preload.cjs
          grep -Fq "contextBridge.exposeInMainWorld('BosleyDesktop'" desktop/preload.cjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          echo "Desktop bridge source and JavaScript syntax checks passed."

      - name: Install dependencies and build installer
        shell: bash
        run: |
          cd desktop
          npm install
          npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Bosley-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
