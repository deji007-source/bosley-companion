
name: Build Bosley Windows App

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies and verify production build
        run: |
          npm install
          npm run build

      - name: Generate Bosley desktop app
        shell: bash
        run: |
          mkdir -p desktop

          cat > desktop/package.json <<'PACKAGE_EOF'
          {
            "name": "bosley-companion-desktop",
            "version": "1.0.2",
            "description": "Bosley floating desktop companion",
            "main": "main.cjs",
            "scripts": {
              "dist": "electron-builder --win nsis"
            },
            "devDependencies": {
              "electron": "^35.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.bosley.companion",
              "productName": "Bosley Companion",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.cjs",
                "preload.cjs",
                "bubble.html"
              ],
              "win": {
                "target": "nsis"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true
              }
            }
          }
          PACKAGE_EOF

          cat > desktop/main.cjs <<'MAIN_EOF'
          const { app, BrowserWindow, ipcMain, screen, shell } = require('electron');
          const path = require('path');

          const SITE = 'https://bosley-companion.vercel.app/';
          let bubble = null;
          let panel = null;

          function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;'
            })[character]);
          }

          function positionWindows() {
            const area = screen.getPrimaryDisplay().workArea;

            if (bubble && !bubble.isDestroyed()) {
              const bubbleWidth = 120;
              const bubbleHeight = 76;

              bubble.setBounds({
                x: area.x + Math.round((area.width - bubbleWidth) / 2),
                y: area.y + 12,
                width: bubbleWidth,
                height: bubbleHeight
              });

              bubble.setAlwaysOnTop(true, 'screen-saver');
            }

            if (panel && !panel.isDestroyed() && panel.isVisible()) {
              const width = Math.min(440, area.width - 24);
              const height = Math.max(320, Math.min(740, area.height - 110));
              const x = area.x + Math.round((area.width - width) / 2);
              const y = Math.min(
                area.y + 98,
                area.y + area.height - height
              );

              panel.setBounds({ x, y, width, height });
            }
          }

          function showLoadError(message) {
            if (!panel || panel.isDestroyed()) return;

            const safeMessage = escapeHtml(message);

            const html = `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Bosley — Connection issue</title>
            <style>
              * { box-sizing: border-box; }
              body {
                margin: 0;
                background: #101010;
                color: #f7f7f7;
                font: 15px system-ui, Segoe UI, Arial, sans-serif;
                padding: 34px;
                display: grid;
                place-items: center;
                min-height: 100vh;
              }
              main { max-width: 330px; }
              h1 { font-size: 23px; margin: 0 0 12px; }
              p {
                line-height: 1.6;
                color: #c8c8c8;
                overflow-wrap: anywhere;
              }
              button {
                border: 0;
                border-radius: 12px;
                padding: 12px 17px;
                background: #f5f5f5;
                color: #111;
                font-weight: 650;
                cursor: pointer;
                margin: 8px 8px 0 0;
              }
              button.secondary {
                background: #282828;
                color: #fff;
                border: 1px solid #454545;
              }
              small {
                display: block;
                color: #888;
                margin-top: 20px;
                line-height: 1.5;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>Bosley couldn't load</h1>
              <p>The desktop panel couldn't display the website.</p>
              <p><strong>Details:</strong> ${safeMessage}</p>
              <button onclick="location.href='${SITE}'">Try again</button>
              <button class="secondary" onclick="window.open('${SITE}','_blank')">
                Open in browser
              </button>
              <small>
                Your Bosley account and Supabase data have not been changed by this message.
              </small>
            </main>
          </body>
          </html>`;

            panel.loadURL(
              'data:text/html;charset=utf-8,' + encodeURIComponent(html)
            ).catch(() => {});
          }

          function createBubble() {
            bubble = new BrowserWindow({
              width: 120,
              height: 76,
              frame: false,
              transparent: true,
              resizable: false,
              movable: true,
              alwaysOnTop: true,
              skipTaskbar: true,
              hasShadow: false,
              backgroundColor: '#00000000',
              webPreferences: {
                preload: path.join(__dirname, 'preload.cjs'),
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            bubble.setAlwaysOnTop(true, 'screen-saver');
            bubble.loadFile(path.join(__dirname, 'bubble.html'));
            bubble.on('closed', () => {
              bubble = null;
            });
          }

          function createPanel() {
            panel = new BrowserWindow({
              width: 440,
              height: 720,
              show: false,
              backgroundColor: '#000000',
              title: 'Bosley Companion',
              autoHideMenuBar: true,
              alwaysOnTop: true,
              webPreferences: {
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            panel.setAlwaysOnTop(true);

            panel.webContents.on(
              'did-fail-load',
              (_event, code, description, failedUrl, isMainFrame) => {
                if (isMainFrame && !String(failedUrl).startsWith('data:')) {
                  showLoadError(
                    `${code}: ${description} (${failedUrl})`
                  );
                }
              }
            );

            panel.webContents.on(
              'render-process-gone',
              (_event, details) => {
                showLoadError(
                  `The page process stopped (${details.reason || 'unknown reason'}).`
                );
              }
            );

            panel.webContents.on('did-finish-load', () => {
              console.log(
                'Bosley page loaded:',
                panel && !panel.isDestroyed()
                  ? panel.webContents.getURL()
                  : 'closed'
              );
            });

            panel.webContents.setWindowOpenHandler(({ url }) => {
              if (
                url.startsWith('https://') ||
                url.startsWith('http://')
              ) {
                shell.openExternal(url);
              }

              return { action: 'deny' };
            });

            panel.loadURL(SITE).catch(error => {
              showLoadError(error.message);
            });

            panel.on('close', event => {
              if (!app.isQuitting) {
                event.preventDefault();
                panel.hide();
              }
            });

            panel.on('closed', () => {
              panel = null;
            });
          }

          function togglePanel() {
            if (!panel || panel.isDestroyed()) {
              createPanel();
            }

            if (panel.isVisible()) {
              panel.hide();
            } else {
              positionWindows();
              panel.show();
              panel.focus();
              bubble?.setAlwaysOnTop(true, 'screen-saver');
            }
          }

          app.whenReady().then(() => {
            createBubble();
            createPanel();
            positionWindows();

            ipcMain.on('toggle-panel', togglePanel);

            screen.on('display-metrics-changed', positionWindows);
            screen.on('display-added', positionWindows);
            screen.on('display-removed', positionWindows);
          });

          app.on('before-quit', () => {
            app.isQuitting = true;
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });
          MAIN_EOF

          cat > desktop/preload.cjs <<'PRELOAD_EOF'
          const { contextBridge, ipcRenderer } = require('electron');

          contextBridge.exposeInMainWorld('bosleyDesktop', {
            togglePanel: () => ipcRenderer.send('toggle-panel')
          });
          PRELOAD_EOF

          cat > desktop/bubble.html <<'BUBBLE_EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">

            <style>
              * {
                box-sizing: border-box;
              }

              html,
              body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
              }

              body {
                display: grid;
                place-items: center;
                -webkit-app-region: drag;
              }

              button {
                width: 108px;
                height: 64px;
                padding: 5px;
                border: 1px solid #fff;
                border-radius: 14px;
                background: #000;
                cursor: pointer;
                display: grid;
                place-items: center;
                -webkit-app-region: no-drag;
                transition: border-color 120ms ease;
              }

              button:hover {
                border-color: #fff;
              }

              button:focus-visible {
                outline: 2px solid #fff;
                outline-offset: 2px;
              }

              svg {
                width: 94px;
                height: 52px;
                display: block;
              }
            </style>
          </head>

          <body>
            <button
              aria-label="Open Bosley chat"
              title="Open Bosley"
            >
              <svg
                viewBox="0 0 94 52"
                role="img"
                aria-label="White outlined incognito hat with two vertical eyes"
              >
                <path
                  d="M31 28 C32 16 38 8 47 8 C56 8 62 16 63 28"
                  fill="none"
                  stroke="#fff"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />

                <path
                  d="M25 29 C31 26 63 26 69 29 L76 34 C78 36 76 38 72 39 C57 42 37 42 22 39 C18 38 16 36 18 34 Z"
                  fill="#000"
                  stroke="#fff"
                  stroke-width="1.7"
                  stroke-linejoin="round"
                />

                <rect
                  x="39"
                  y="20"
                  width="5"
                  height="15"
                  rx="2.5"
                  fill="#fff"
                />

                <rect
                  x="50"
                  y="20"
                  width="5"
                  height="15"
                  rx="2.5"
                  fill="#fff"
                />
              </svg>
            </button>

            <script>
              document
                .querySelector('button')
                .addEventListener('click', () => {
                  window.bosleyDesktop.togglePanel();
                });
            </script>
          </body>
          </html>
          BUBBLE_EOF

      - name: Install dependencies and build installer
        shell: bash
        run: |
          cd desktop
          npm install
          npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Bosley-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
