
name: Build Bosley Windows App
run-name: Bosley Windows Build (${{ github.sha }})

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"
      - "index.html"
      - "package.json"
      - "scripts/**"
      - "src/**"
      - "src/styles.css"
      - "vite.config.ts"
      - "tsconfig*.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies and verify production build
        shell: bash
        run: |
          npm install
          npm run test:companion
          node scripts/check-windows-idle.mjs
          npm run build

      - name: Check inline website JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs, body]) => !/\bsrc\s*=/.test(attrs) && body.trim());
          if (!scripts.length) throw new Error('No inline application script found.');
          scripts.forEach(([, , body], index) => fs.writeFileSync(`.bosley-inline-check-${index}.cjs`, body));
          console.log(`Extracted ${scripts.length} inline script(s) for syntax checks.`);
          NODE
          for file in .bosley-inline-check-*.cjs; do node --check "$file"; done
          rm -f .bosley-inline-check-*.cjs

      - name: Generate Bosley desktop app
        shell: bash
        run: |
          mkdir -p desktop

          cat > desktop/package.json <<'PACKAGE_EOF'
          {
            "name": "bosley-companion-desktop",
            "version": "1.1.0",
            "description": "Bosley floating desktop companion",
            "main": "main.cjs",
            "scripts": {
              "dist": "electron-builder --win nsis"
            },
            "devDependencies": {
              "electron": "^35.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.bosley.companion",
              "productName": "Bosley Companion",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.cjs",
                "preload.cjs",
                "bubble.html",
                "companion.html",
                "index.html",
                "assets/**"
              ],
              "win": {
                "target": "nsis",
                "icon": "assets/bosley.ico"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true
              }
            }
          }
          PACKAGE_EOF

          # Package the same standalone UI that is deployed as the working website.
          # dist/index.html is a separate React shell, not the production companion UI.
          cp index.html desktop/index.html
          # Vite currently inlines the app's JavaScript and CSS into index.html.
          # Copy asset files when emitted, but don't fail when the build is self-contained.
          mkdir -p desktop/assets
          if [ -d dist/assets ]; then
            cp -R dist/assets/. desktop/assets/
          fi

          # Bundle the already-installed Supabase client for file:// startup.
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js desktop/assets/supabase.js

          cat > desktop/companion.html <<'COMPANION_HTML_EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title></title>
            <style>
              *{box-sizing:border-box}
              html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
              body{display:grid;place-items:center;-webkit-app-region:drag;user-select:none}
              svg{width:100%;height:100%;display:block;overflow:visible}
              #ghost{transform-origin:50% 50%;animation:ghost-float 3.6s ease-in-out infinite}
              .ghost-shape{fill:#fff;stroke:#101820;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
              .ghost-edge{fill:none;stroke:#55c6e8;stroke-width:2;opacity:.72}
              .ghost-eye{fill:#050505;transform-box:fill-box;transform-origin:center;animation:ghost-blink 5.1s ease-in-out infinite}
               .ghost-mouth{fill:none;stroke:#050505;stroke-width:3.2;stroke-linecap:round;transform-box:fill-box;transform-origin:center}
              body[data-state="speaking"] .ghost-mouth{stroke-width:3.2}
              #eye-R{animation-delay:.035s}
              body[data-state="listening"] #ghost{animation:ghost-listen .7s ease-in-out infinite alternate}
              body[data-state="thinking"] #ghost,body[data-state="working"] #ghost{animation:ghost-think .8s ease-in-out infinite alternate}
              body[data-state="success"] .ghost-edge{opacity:1}
              body[data-state="error"] .ghost-edge{stroke:#9aa4ad;opacity:1}
              @keyframes ghost-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
              @keyframes ghost-listen{from{transform:translateY(0) scale(1)}to{transform:translateY(-3px) scale(1.035)}}
              @keyframes ghost-think{from{transform:translateY(1px) scale(.985)}to{transform:translateY(-3px) scale(1.035)}}
              @keyframes ghost-blink{0%,45%,48%,100%{transform:scaleY(1)}46.5%,47.5%{transform:scaleY(.08)}}
              @keyframes ghost-talk{from{transform:scaleY(.35)}to{transform:scaleY(1.8)}}
              @media(prefers-reduced-motion:reduce){#ghost,.ghost-eye{animation:none!important}}
            </style>
          </head>
          <body data-state="idle">
            <svg viewBox="0 0 150 180" role="img" aria-label="Bosley white ghost with blinking eyes and an animated speaking mouth" xmlns="http://www.w3.org/2000/svg">
              <defs><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter></defs>
              <g id="ghost">
                <path d="M75 12C42 12 18 39 18 76v43c0 5 2 8 6 8 4 0 8-4 12-9 4-5 8-7 12-7 5 0 8 4 12 9 4 5 8 8 13 8s9-3 13-8c4-5 7-9 12-9 4 0 8 2 12 7 4 5 8 9 12 9 4 0 6-3 6-8V76c0-37-26-64-60-64Z" fill="#55c6e8" opacity=".32" filter="url(#glow)"/>
                <path class="ghost-shape" d="M75 12C42 12 18 39 18 76v43c0 5 2 8 6 8 4 0 8-4 12-9 4-5 8-7 12-7 5 0 8 4 12 9 4 5 8 8 13 8s9-3 13-8c4-5 7-9 12-9 4 0 8 2 12 7 4 5 8 9 12 9 4 0 6-3 6-8V76c0-37-26-64-60-64Z"/>
                <path class="ghost-edge" d="M22 111V76c0-34 22-60 53-60"/>
                <ellipse id="eye-L" class="ghost-eye" cx="56" cy="78" rx="10.5" ry="14.5"/>
                <ellipse id="eye-R" class="ghost-eye" cx="94" cy="78" rx="10.5" ry="14.5"/>
                <path id="ghost-mouth" class="ghost-mouth" d="M68 108 Q75 110 82 108"/>
              </g>
            </svg>
            <script src="./assets/companion.js"></script>
          </body>
          </html>
          COMPANION_HTML_EOF

          cat > desktop/assets/companion.js <<'COMPANION_JS_EOF'
          (function(){
            const allowed=['idle','listening','thinking','speaking','working','waiting','success','error','walk'];
            const apply=state=>{document.body.dataset.state=allowed.includes(state)?state:'idle';};
            if(window.BosleyDesktop?.onCompanionState)window.BosleyDesktop.onCompanionState(apply);
            document.addEventListener('visibilitychange',()=>{if(document.hidden)document.body.dataset.state='idle';});
          })();
          COMPANION_JS_EOF
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js#./assets/supabase.js#g' desktop/index.html

          cat > desktop/main.cjs <<'MAIN_EOF'
          const { app, BrowserWindow, ipcMain, screen, shell, dialog, desktopCapturer, globalShortcut, clipboard } = require('electron');
          const path = require('path');
          const { fileURLToPath } = require('url');
          const fs = require('fs');
          const { spawn } = require('child_process');

          // Persist startup diagnostics so a black/blank panel can be investigated without guessing.
          const startupLog = path.join(app.getPath('userData'), 'bosley-startup.log');
          function logStartup(...parts) {
            const line = new Date().toISOString() + ' ' + parts.map(part => {
              if (part instanceof Error) return part.stack || part.message;
              if (typeof part === 'string') return part;
              try { return JSON.stringify(part); } catch { return String(part); }
            }).join(' ') + '\\n';
            try { fs.appendFileSync(startupLog, line, 'utf8'); } catch {}
            console.error(line.trimEnd());
          }
          process.on('uncaughtException', error => logStartup('MAIN UNCAUGHT EXCEPTION', error));
          process.on('unhandledRejection', reason => logStartup('MAIN UNHANDLED REJECTION', reason));

          // The Windows mascot uses a transparent Three.js WebGL renderer.
          // Disabling hardware acceleration here prevents Chromium from creating
          // the WebGL context, leaving the separate mascot window completely blank.
          // Keep Chromium GPU/WebGL enabled; the normal app windows remain transparent.

          const SITE = 'https://bosley-companion.vercel.app/';
          let bubble = null;
          let panel = null;
          // Keep the companion open until the user closes or hides it explicitly.
          function clearPanelIdleClose() {}
          function armPanelIdleClose() {}
          let usingHostedFallback = false;
          let widgetAppearance = { size: 'default', edge: 'sharp', border: 'thin' };
          // Slim bezel-connected Dynamic Island sizes; keep the island centered on the physical display edge.
          const WIDGET_SIZES = {
            compact: { width: 220, height: 15 },
            default: { width: 260, height: 17 },
            wide: { width: 300, height: 19 }
          };

          function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;'
            })[character]);
          }

          function positionWindows() {
            const display = screen.getPrimaryDisplay();
            const area = display.workArea;
            const bounds = display.bounds;

            if (writingBulb && !writingBulb.isDestroyed()) {
              const bulbBounds = writingBulb.getBounds();
              const x = Math.max(area.x, Math.min(bulbBounds.x, area.x + area.width - bulbBounds.width));
              const y = Math.max(area.y, Math.min(bulbBounds.y, area.y + area.height - bulbBounds.height));
              writingBulb.setBounds({ x, y, width: bulbBounds.width, height: bulbBounds.height });
              writingBulb.setAlwaysOnTop(true, 'screen-saver');
            }

            if (bubble && !bubble.isDestroyed()) {
              const dimensions = WIDGET_SIZES[widgetAppearance.size] || WIDGET_SIZES.default;
              const bubbleWidth = dimensions.width;
              const bubbleHeight = dimensions.height;

              bubble.setBounds({
                x: bounds.x + Math.round((bounds.width - bubbleWidth) / 2),
                y: bounds.y,
                width: bubbleWidth,
                height: bubbleHeight
              });

              bubble.setAlwaysOnTop(true, 'screen-saver');
            }

            if (panel && !panel.isDestroyed()) {
              // Keep the workspace island snapped to the top bezel and centred above the desktop.
              const islandWidth = Math.min(340, bounds.width);
              const islandHeight = Math.min(islandWidth, bounds.height);
              panel.setBounds({
                x: bounds.x + Math.round((bounds.width - islandWidth) / 2),
                y: bounds.y,
                width: islandWidth,
                height: islandHeight
              });
            }
          }

          function showLoadError(message) {
            if (!panel || panel.isDestroyed()) return;

            const safeMessage = escapeHtml(message);

            const html = `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Bosley — Connection issue</title>
            <style>
              * { box-sizing: border-box; }
              body {
                margin: 0;
                background: #101010;
                color: #f7f7f7;
                font: 15px system-ui, Segoe UI, Arial, sans-serif;
                padding: 34px;
                display: grid;
                place-items: center;
                min-height: 100vh;
              }
              main { max-width: 330px; }
              h1 { font-size: 23px; margin: 0 0 12px; }
              p {
                line-height: 1.6;
                color: #c8c8c8;
                overflow-wrap: anywhere;
              }
              button {
                border: 0;
                border-radius: 12px;
                padding: 12px 17px;
                background: #f5f5f5;
                color: #111;
                font-weight: 650;
                cursor: pointer;
                margin: 8px 8px 0 0;
              }
              button.secondary {
                background: #282828;
                color: #fff;
                border: 1px solid #454545;
              }
              small {
                display: block;
                color: #888;
                margin-top: 20px;
                line-height: 1.5;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>Bosley couldn't load</h1>
              <p>The desktop panel couldn't display the website.</p>
              <p><strong>Details:</strong> ${safeMessage}</p>
              <button onclick="location.href='${SITE}'">Try again</button>
              <button class="secondary" onclick="window.open('${SITE}','_blank')">
                Open in browser
              </button>
              <small>
                Your Bosley account and Supabase data have not been changed by this message.
              </small>
            </main>
          </body>
          </html>`;

            panel.loadURL(
              'data:text/html;charset=utf-8,' + encodeURIComponent(html)
            ).catch(() => {});
          }

          function loadHostedFallback(reason) {
            if (!panel || panel.isDestroyed()) return;
            if (usingHostedFallback) { showLoadError(reason || 'The bundled and hosted interfaces could not be loaded.'); return; }
            usingHostedFallback = true;
            logStartup('LOCAL UI FALLBACK', reason);
            panel.loadURL(SITE).catch(error => showLoadError((reason ? reason + '\n\n' : '') + 'The hosted fallback also failed: ' + error.message));
          }

          function createBubble() {
            const dimensions = WIDGET_SIZES[widgetAppearance.size] || WIDGET_SIZES.default;
            bubble = new BrowserWindow({
              width: dimensions.width,
              height: dimensions.height,
              frame: false,
              transparent: true,
              resizable: false,
              movable: true,
              alwaysOnTop: true,
              skipTaskbar: true,
              hasShadow: false,
              backgroundColor: '#00000000',
              webPreferences: {
                preload: path.join(__dirname, 'preload.cjs'),
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            bubble.setAlwaysOnTop(true, 'screen-saver');
            bubble.once('ready-to-show', () => {
              if (!bubble || bubble.isDestroyed()) return;
              bubble.setAlwaysOnTop(true, 'screen-saver');
              bubble.showInactive();
            });
            bubble.loadFile(path.join(__dirname, 'bubble.html')).then(() => {
              if (!bubble || bubble.isDestroyed()) return;
              bubble.webContents.send('bosley:widget-appearance', widgetAppearance);
              if (!bubble.isVisible()) bubble.showInactive();
              bubble.setAlwaysOnTop(true, 'screen-saver');
              logStartup('TOP WIDGET VISIBLE', bubble.getBounds());
            }).catch(error => logStartup('BUBBLE LOAD FAILED', error.message));
            bubble.on('closed', () => {
              bubble = null;
            });
          }

          // Dedicated Windows writing bulb: a native, always-on-top overlay available
          // above other applications. It opens Bosley's own editor; it never reads other apps.
          let writingBulb = null;
          let writingBulbHideTimer = null;
          let writingBulbVisibleUntil = 0;
          function showWritingBulbForFiveSeconds() {
            if (writingBulb && !writingBulb.isDestroyed() && writingBulb.isVisible()) {
              writingBulb.hide();
              if (writingBulbHideTimer) clearTimeout(writingBulbHideTimer);
              writingBulbHideTimer = null;
              writingBulbVisibleUntil = 0;
              if (!panel || panel.isDestroyed()) createPanel();
              if (bubble && !bubble.isDestroyed()) bubble.hide();
              panel.show();
              panel.focus();
              panel.setAlwaysOnTop(true, 'screen-saver');
              armPanelIdleClose();
              logStartup('GHOST TAPPED AGAIN: OPENED BOSLEY COMPANION');
              return;
            }
            writingBulbVisibleUntil = Date.now() + 5000;
            if (!writingBulb || writingBulb.isDestroyed()) createWritingBulb();
            if (writingBulb && !writingBulb.isDestroyed()) {
              writingBulb.setAlwaysOnTop(true, 'screen-saver');
              writingBulb.showInactive();
            }
            if (writingBulbHideTimer) clearTimeout(writingBulbHideTimer);
            writingBulbHideTimer = setTimeout(() => {
              writingBulbHideTimer = null;
              if (writingBulb && !writingBulb.isDestroyed() && Date.now() >= writingBulbVisibleUntil) {
                writingBulb.hide();
                logStartup('WINDOWS WRITING BULB AUTO-HIDDEN AFTER FIVE SECONDS');
              }
            }, 5000);
          }
          function createWritingBulb() {
            if (process.platform !== 'win32' || (writingBulb && !writingBulb.isDestroyed())) return;
            const display = screen.getPrimaryDisplay();
            const area = display.workArea;
            const width = 60, height = 60;
            writingBulb = new BrowserWindow({
              x: area.x + area.width - width - 18, y: area.y + Math.round(area.height * 0.34),
              width, height, frame: false, transparent: true, resizable: false, movable: true,
              show: false, alwaysOnTop: true, skipTaskbar: true, hasShadow: false,
              backgroundColor: '#00000000',
              webPreferences: { preload: path.join(__dirname, 'preload.cjs'), contextIsolation: true, nodeIntegration: false, sandbox: true }
            });
            writingBulb.setAlwaysOnTop(true, 'screen-saver');
            const html = '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:grid;place-items:center;-webkit-app-region:drag}button{-webkit-app-region:no-drag;width:42px;height:42px;border-radius:50%;border:1.5px solid #111;background:#fff;color:#080808;box-shadow:0 3px 14px #0007;cursor:pointer;padding:8px}svg{width:100%;height:100%;display:block}button:focus-visible{outline:2px solid #111;outline-offset:2px}</style></head><body><button title="Open Bosley Writing and Ideas" aria-label="Open Bosley Writing and Ideas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M8.2 14.5A6.8 6.8 0 1 1 15.8 14.5c-.9.7-1.3 1.4-1.5 2.5h-4.6c-.2-1.1-.6-1.8-1.5-2.5Z"/><path d="M12 2V0M3.5 4.5 2 3M20.5 4.5 22 3"/></svg></button><script>document.querySelector("button").addEventListener("click",()=>window.bosleyDesktop.openWritingAssistant())</script></body></html>';
            writingBulb.loadURL('data:text/html;charset=utf-8,' + encodeURIComponent(html)).then(() => {
              if (!writingBulb || writingBulb.isDestroyed()) return;
              writingBulb.setAlwaysOnTop(true, 'screen-saver');
              if (Date.now() >= writingBulbVisibleUntil) {
                writingBulb.hide();
                return;
              }
              writingBulb.showInactive();
              logStartup('WINDOWS WRITING BULB VISIBLE', writingBulb.getBounds());
            }).catch(error => logStartup('WINDOWS WRITING BULB LOAD FAILED', error.message));
            writingBulb.on('closed', () => {
              writingBulb = null;
              if (writingBulbHideTimer) clearTimeout(writingBulbHideTimer);
              writingBulbHideTimer = null;
            });
          }
          function toggleWritingBulb() {
            if (writingBulb && !writingBulb.isDestroyed() && writingBulb.isVisible()) {
              writingBulb.hide();
              writingBulbVisibleUntil = 0;
              if (writingBulbHideTimer) clearTimeout(writingBulbHideTimer);
              writingBulbHideTimer = null;
              logStartup('WINDOWS WRITING BULB HIDDEN');
              return;
            }
            // The Windows bulb is shown only on the user's Ctrl+Shift+I shortcut.
            // Keep it visible until clicked or toggled off; do not use the Android 5s timer here.
            writingBulbVisibleUntil = Number.POSITIVE_INFINITY;
            if (writingBulbHideTimer) clearTimeout(writingBulbHideTimer);
            writingBulbHideTimer = null;
            if (!writingBulb || writingBulb.isDestroyed()) createWritingBulb();
            else {
              writingBulb.setAlwaysOnTop(true, 'screen-saver');
              writingBulb.showInactive();
              logStartup('WINDOWS WRITING BULB VISIBLE', writingBulb.getBounds());
            }
          }
          let writingCard = null;
          function openWritingAssistantFromBulb() {
            if (writingBulb && !writingBulb.isDestroyed()) writingBulb.hide();
            if (writingBulbHideTimer) clearTimeout(writingBulbHideTimer);
            writingBulbHideTimer = null;
            writingBulbVisibleUntil = 0;
            if (writingCard && !writingCard.isDestroyed()) {
              writingCard.show();
              writingCard.focus();
              writingCard.setAlwaysOnTop(true, 'screen-saver');
              return;
            }
            const cardArea = screen.getPrimaryDisplay().workArea;
            const cardWidth = Math.min(340, Math.max(300, cardArea.width - 24));
            const cardHeight = Math.min(700, Math.max(560, cardArea.height - 24));
            writingCard = new BrowserWindow({
              x: cardArea.x + cardArea.width - cardWidth - 18,
              y: cardArea.y + Math.max(12, Math.round((cardArea.height - cardHeight) * 0.35)),
              width: cardWidth, height: cardHeight, minWidth: Math.min(300, cardWidth), minHeight: Math.min(480, cardHeight),
              frame: false, transparent: true, resizable: true, movable: true,
              show: false, alwaysOnTop: true, skipTaskbar: true, hasShadow: true,
              backgroundColor: '#00000000',
              webPreferences: { preload: path.join(__dirname, 'preload.cjs'), contextIsolation: true, nodeIntegration: false, sandbox: true }
            });
            writingCard.setAlwaysOnTop(true, 'screen-saver');
            writingCard.loadFile(path.join(__dirname, 'index.html'), { query: { bosleyWritingCard: '1' } }).then(() => {
              if (!writingCard || writingCard.isDestroyed()) return;
              writingCard.show();
              writingCard.focus();
              writingCard.setAlwaysOnTop(true, 'screen-saver');
              logStartup('WRITING IDEAS CARD VISIBLE', writingCard.getBounds());
            }).catch(error => logStartup('WRITING IDEAS CARD FAILED', error.message));
            writingCard.on('closed', () => { writingCard = null; });
          }

          // Persist the walking companion preference locally; never sync desktop visibility to the cloud.
          const companionPreferenceFile = path.join(app.getPath('userData'), 'walking-companion.json');
          let walkingCompanionPreference = { version: 2, enabled: true, x: null, y: null };
          function readWalkingCompanionPreference() {
            try {
              const saved = JSON.parse(fs.readFileSync(companionPreferenceFile, 'utf8'));
              return {
                // Version 1 stored an accidental disabled state during earlier widget experiments.
                // Migrate it once to the expected visible-by-default companion state.
                version: 2,
                enabled: saved.version === 2 && typeof saved.enabled === 'boolean' ? saved.enabled : true,
                x: Number.isFinite(saved.x) ? saved.x : null,
                y: Number.isFinite(saved.y) ? saved.y : null
              };
            } catch { return { version: 2, enabled: true, x: null, y: null }; }
          }
          walkingCompanionPreference = readWalkingCompanionPreference();
          let walkingCompanionEnabled = walkingCompanionPreference.enabled;
          function saveWalkingCompanionPreference() {
            try {
              fs.mkdirSync(path.dirname(companionPreferenceFile), { recursive: true });
              fs.writeFileSync(companionPreferenceFile, JSON.stringify({
                version: 2,
                enabled: walkingCompanionEnabled,
                x: walkingCompanionPreference.x,
                y: walkingCompanionPreference.y
              }, null, 2), 'utf8');
            } catch (error) { logStartup('COMPANION PREFERENCE SAVE FAILED', error.message); }
          }

          // A draggable, always-on-top 3D-style desktop mascot. Ctrl+Alt+B toggles visibility.
          let walkingCompanion = null;
          function createWalkingCompanion() {
            if (process.platform !== 'win32' || (walkingCompanion && !walkingCompanion.isDestroyed())) return;
            const display = screen.getPrimaryDisplay();
            const area = display.workArea;
            const width = 92, height = 114;
            const fallbackX = area.x + Math.round((area.width - width) / 2);
            const fallbackY = area.y + 8;
            const x = Math.max(area.x, Math.min(walkingCompanionPreference.x ?? fallbackX, area.x + area.width - width));
            const y = Math.max(area.y, Math.min(walkingCompanionPreference.y ?? fallbackY, area.y + area.height - height));
            walkingCompanion = new BrowserWindow({
              x, y, width, height, title: ' ',
              frame: false, transparent: true, resizable: false, movable: true,
