
name: Build Bosley Windows App

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"
      - "index.html"
      - "package.json"
      - "scripts/**"
      - "src/**"
      - "src/styles.css"
      - "vite.config.ts"
      - "tsconfig*.json"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies and verify production build
        shell: bash
        run: |
          npm install
          npm run test:companion
          npm run build

      - name: Check inline website JavaScript syntax
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs, body]) => !/\bsrc\s*=/.test(attrs) && body.trim());
          if (!scripts.length) throw new Error('No inline application script found.');
          scripts.forEach(([, , body], index) => fs.writeFileSync(`.bosley-inline-check-${index}.cjs`, body));
          console.log(`Extracted ${scripts.length} inline script(s) for syntax checks.`);
          NODE
          for file in .bosley-inline-check-*.cjs; do node --check "$file"; done
          rm -f .bosley-inline-check-*.cjs

      - name: Generate Bosley desktop app
        shell: bash
        run: |
          mkdir -p desktop

          cat > desktop/package.json <<'PACKAGE_EOF'
          {
            "name": "bosley-companion-desktop",
            "version": "1.1.0",
            "description": "Bosley floating desktop companion",
            "main": "main.cjs",
            "scripts": {
              "dist": "electron-builder --win nsis"
            },
            "devDependencies": {
              "electron": "^35.0.0",
              "electron-builder": "^26.0.0"
            },
            "build": {
              "appId": "com.bosley.companion",
              "productName": "Bosley Companion",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.cjs",
                "preload.cjs",
                "bubble.html",
                "index.html",
                "assets/**"
              ],
              "win": {
                "target": "nsis",
                "icon": "assets/bosley.ico"
              },
              "nsis": {
                "oneClick": false,
                "allowToChangeInstallationDirectory": true
              }
            }
          }
          PACKAGE_EOF

          # Package the same standalone UI that is deployed as the working website.
          # dist/index.html is a separate React shell, not the production companion UI.
          cp index.html desktop/index.html
          # Vite currently inlines the app's JavaScript and CSS into index.html.
          # Copy asset files when emitted, but don't fail when the build is self-contained.
          mkdir -p desktop/assets
          if [ -d dist/assets ]; then
            cp -R dist/assets/. desktop/assets/
          fi

          # Bundle the already-installed Supabase client for file:// startup.
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js desktop/assets/supabase.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js#./assets/supabase.js#g' desktop/index.html

          cat > desktop/main.cjs <<'MAIN_EOF'
          const { app, BrowserWindow, ipcMain, screen, shell, dialog, desktopCapturer } = require('electron');
          const path = require('path');
          const { fileURLToPath } = require('url');
          const fs = require('fs');
          const { spawn } = require('child_process');

          // Persist startup diagnostics so a black/blank panel can be investigated without guessing.
          const startupLog = path.join(app.getPath('userData'), 'bosley-startup.log');
          function logStartup(...parts) {
            const line = new Date().toISOString() + ' ' + parts.map(part => {
              if (part instanceof Error) return part.stack || part.message;
              if (typeof part === 'string') return part;
              try { return JSON.stringify(part); } catch { return String(part); }
            }).join(' ') + '\\n';
            try { fs.appendFileSync(startupLog, line, 'utf8'); } catch {}
            console.error(line.trimEnd());
          }
          process.on('uncaughtException', error => logStartup('MAIN UNCAUGHT EXCEPTION', error));
          process.on('unhandledRejection', reason => logStartup('MAIN UNHANDLED REJECTION', reason));

          // Avoid black Electron surfaces on Windows systems with unstable GPU drivers.
          app.disableHardwareAcceleration();

          const SITE = 'https://bosley-companion.vercel.app/';
          let bubble = null;
          let panel = null;
          let usingHostedFallback = false;
          let widgetAppearance = { size: 'default', edge: 'sharp', border: 'thin' };
          // Slim bezel-connected Dynamic Island sizes; keep the island centered on the physical display edge.
          const WIDGET_SIZES = {
            compact: { width: 220, height: 32 },
            default: { width: 260, height: 36 },
            wide: { width: 300, height: 40 }
          };

          function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, character => ({
              '&': '&amp;',
              '<': '&lt;',
              '>': '&gt;',
              '"': '&quot;',
              "'": '&#39;'
            })[character]);
          }

          function positionWindows() {
            const display = screen.getPrimaryDisplay();
            const area = display.workArea;
            const bounds = display.bounds;

            if (bubble && !bubble.isDestroyed()) {
              const dimensions = WIDGET_SIZES[widgetAppearance.size] || WIDGET_SIZES.default;
              const bubbleWidth = dimensions.width;
              const bubbleHeight = dimensions.height;

              bubble.setBounds({
                x: bounds.x + Math.round((bounds.width - bubbleWidth) / 2),
                y: bounds.y,
                width: bubbleWidth,
                height: bubbleHeight
              });

              bubble.setAlwaysOnTop(true, 'screen-saver');
            }

            if (panel && !panel.isDestroyed()) {
              // Keep the expanded companion compact and attached to the top-center bezel.
              const width = Math.min(420, Math.max(320, area.width - 16));
              const height = Math.min(480, Math.max(300, Math.round(area.height * 0.52)));
              const x = bounds.x + Math.round((bounds.width - width) / 2);
              const y = bounds.y;

              panel.setBounds({ x, y, width, height });
            }
          }

          function showLoadError(message) {
            if (!panel || panel.isDestroyed()) return;

            const safeMessage = escapeHtml(message);

            const html = `<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Bosley — Connection issue</title>
            <style>
              * { box-sizing: border-box; }
              body {
                margin: 0;
                background: #101010;
                color: #f7f7f7;
                font: 15px system-ui, Segoe UI, Arial, sans-serif;
                padding: 34px;
                display: grid;
                place-items: center;
                min-height: 100vh;
              }
              main { max-width: 330px; }
              h1 { font-size: 23px; margin: 0 0 12px; }
              p {
                line-height: 1.6;
                color: #c8c8c8;
                overflow-wrap: anywhere;
              }
              button {
                border: 0;
                border-radius: 12px;
                padding: 12px 17px;
                background: #f5f5f5;
                color: #111;
                font-weight: 650;
                cursor: pointer;
                margin: 8px 8px 0 0;
              }
              button.secondary {
                background: #282828;
                color: #fff;
                border: 1px solid #454545;
              }
              small {
                display: block;
                color: #888;
                margin-top: 20px;
                line-height: 1.5;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>Bosley couldn't load</h1>
              <p>The desktop panel couldn't display the website.</p>
              <p><strong>Details:</strong> ${safeMessage}</p>
              <button onclick="location.href='${SITE}'">Try again</button>
              <button class="secondary" onclick="window.open('${SITE}','_blank')">
                Open in browser
              </button>
              <small>
                Your Bosley account and Supabase data have not been changed by this message.
              </small>
            </main>
          </body>
          </html>`;

            panel.loadURL(
              'data:text/html;charset=utf-8,' + encodeURIComponent(html)
            ).catch(() => {});
          }

          function loadHostedFallback(reason) {
            if (!panel || panel.isDestroyed()) return;
            if (usingHostedFallback) { showLoadError(reason || 'The bundled and hosted interfaces could not be loaded.'); return; }
            usingHostedFallback = true;
            logStartup('LOCAL UI FALLBACK', reason);
            panel.loadURL(SITE).catch(error => showLoadError((reason ? reason + '\n\n' : '') + 'The hosted fallback also failed: ' + error.message));
          }

          function createBubble() {
            const dimensions = WIDGET_SIZES[widgetAppearance.size] || WIDGET_SIZES.default;
            bubble = new BrowserWindow({
              width: dimensions.width,
              height: dimensions.height,
              frame: false,
              transparent: true,
              resizable: false,
              movable: true,
              alwaysOnTop: true,
              skipTaskbar: true,
              hasShadow: false,
              backgroundColor: '#00000000',
              webPreferences: {
                preload: path.join(__dirname, 'preload.cjs'),
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            bubble.setAlwaysOnTop(true, 'screen-saver');
            bubble.loadFile(path.join(__dirname, 'bubble.html')).then(() => {
              bubble.webContents.send('bosley:widget-appearance', widgetAppearance);
            }).catch(error => logStartup('BUBBLE LOAD FAILED', error.message));
            bubble.on('closed', () => {
              bubble = null;
            });
          }

          let guideLineWindow = null;
          let guideCardWindow = null;
          let guideTargetWindow = null;
          function stopVisualGuide() {
            for (const win of [guideTargetWindow, guideLineWindow, guideCardWindow]) {
              if (win && !win.isDestroyed()) win.close();
            }
            guideTargetWindow = null;
            guideLineWindow = null;
            guideCardWindow = null;
          }
          let guideAccessToken = '';
          let guideInstructionForTarget = '';
          async function findVisualGuideTarget() {
            if (!guideAccessToken) throw new Error('Sign in to Bosley before using automatic target detection.');
            const choice = await dialog.showMessageBox(panel && !panel.isDestroyed() ? panel : undefined, {
              type: 'question', buttons: ['Cancel', 'Capture and find target'], defaultId: 0, cancelId: 0,
              title: 'Bosley Guide — screen access',
              message: 'Capture the current screen to locate the relevant control?',
              detail: 'The screenshot is sent to Bosley AI for visual analysis. Do not continue if the screen contains private information you do not want processed.'
            });
            if (choice.response !== 1) return { ok: false, cancelled: true };
            const display = screen.getPrimaryDisplay();
            const sources = await desktopCapturer.getSources({ types: ['screen'], thumbnailSize: { width: 1280, height: 720 }, fetchWindowIcons: false });
            const source = sources.find(item => String(item.display_id) === String(display.id)) || sources[0];
            if (!source || source.thumbnail.isEmpty()) throw new Error('Windows did not provide a screenshot.');
            const image = 'data:image/jpeg;base64,' + source.thumbnail.resize({ width: 1280, height: 720 }).toJPEG(76).toString('base64');
            const prompt = 'You are locating a UI control in a screenshot for a visual guide. Task goal: ' + guideInstructionForTarget +
              '\\nReturn ONLY one JSON object: {"found":true,"x":0.0,"y":0.0,"confidence":0.0,"target":"short label"} or {"found":false,"reason":"short reason"}. x and y are normalized screenshot coordinates from 0 to 1, measured at the CENTER of the exact visible control most relevant to the task. Prefer the actual button, input, tab, or control, not a generic screen location. If the target app/control is not visible or ambiguous, return found:false. Never guess.';
            const response = await fetch('https://ywwfqisbmlkjcfoqehph.supabase.co/functions/v1/companion-chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + guideAccessToken, 'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3d2ZxaXNibWxramNmb3FlaHBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1ODA2MDksImV4cCI6MjA5NTE1NjYwOX0.__Dwk0-YjWNe9o3EaICSxnJlRKMlJw67XSUc_KjU_sU' },
              body: JSON.stringify({ messages: [{ role: 'user', content: [{ type: 'text', text: prompt }, { type: 'image_url', image_url: { url: image } }] }] })
            });
            if (!response.ok) throw new Error('Bosley AI could not analyze the screen (HTTP ' + response.status + ').');
            const raw = await response.text();
            const chunks = [];
            for (const line of raw.split(/\\r?\\n/)) {
              if (!line.startsWith('data:')) continue;
              const data = line.slice(5).trim();
              if (!data || data === '[DONE]') continue;
              try { const packet = JSON.parse(data); const delta = packet.choices?.[0]?.delta?.content; if (typeof delta === 'string') chunks.push(delta); } catch {}
            }
            let answer = chunks.join('').trim().replace(/^\`\`\`(?:json)?\\s*/i, '').replace(/\\s*\`\`\`$/, '');
            const first = answer.indexOf('{'), last = answer.lastIndexOf('}');
            if (first < 0 || last <= first) throw new Error('Bosley returned no usable target coordinates. Try again with the target app visible.');
            const result = JSON.parse(answer.slice(first, last + 1));
            if (result.found !== true || !Number.isFinite(Number(result.x)) || !Number.isFinite(Number(result.y))) {
              return { ok: false, found: false, reason: String(result.reason || 'The target could not be identified confidently.') };
            }
            const bounds = display.bounds;
            const x = Math.round(Math.max(0, Math.min(1, Number(result.x))) * bounds.width);
            const y = Math.round(Math.max(0, Math.min(1, Number(result.y))) * bounds.height);
            if (!guideTargetWindow || guideTargetWindow.isDestroyed()) throw new Error('The visual guide was closed before target detection finished.');
            guideTargetWindow.setPosition(Math.round(bounds.x + x - 18), Math.round(bounds.y + y - 18));
            return { ok: true, found: true, x, y, target: String(result.target || 'target').slice(0, 80), confidence: Number(result.confidence) || 0 };
          }
          function openVisualGuide(payload = {}) {
            stopVisualGuide();
            guideAccessToken = String(payload.accessToken || '');
            guideInstructionForTarget = String(payload.taskTitle || payload.instruction || '').slice(0, 500);
            const display = screen.getPrimaryDisplay();
            const bounds = display.bounds;
            const instruction = String(payload.instruction || 'Follow the tether to the next step.').slice(0, 220);
            let targetX = Math.max(20, Math.min(bounds.width - 20, Number(payload.x) || Math.round(bounds.width * 0.55)));
            let targetY = Math.max(60, Math.min(bounds.height - 40, Number(payload.y) || Math.round(bounds.height * 0.55)));
            guideLineWindow = new BrowserWindow({ x: bounds.x, y: bounds.y, width: bounds.width, height: bounds.height, frame: false, transparent: true, backgroundColor: '#00000000', resizable: false, movable: false, focusable: false, skipTaskbar: true, hasShadow: false, webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true } });
            guideLineWindow.setAlwaysOnTop(true, 'screen-saver');
            guideLineWindow.setIgnoreMouseEvents(true, { forward: true });
            const svg = '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}svg{width:100%;height:100%}path{fill:none;stroke-linecap:round;stroke-linejoin:round;animation:flow 1s linear infinite}#guideOutline{stroke:#000;stroke-width:7;stroke-dasharray:8 10;opacity:.98}#guidePath{stroke:#fff;stroke-width:3;stroke-dasharray:8 10;filter:drop-shadow(0 0 3px #fff)}#guideDot{fill:#fff;stroke:#000;stroke-width:3;filter:drop-shadow(0 0 2px #fff)}circle{fill:#fff;filter:drop-shadow(0 0 8px #fff)}@keyframes flow{to{stroke-dashoffset:-36}}</style></head><body><svg viewBox="0 0 '+bounds.width+' '+bounds.height+'" preserveAspectRatio="none"><path id="guideOutline" d=""/><path id="guidePath" d=""/><circle id="guideDot" cx="'+targetX+'" cy="'+targetY+'" r="8"/></svg><script>function setTarget(x,y){const w='+bounds.width+',h='+bounds.height+',sx=Math.round(w/2),sy=Math.max(50,h-70);document.getElementById("guideDot").setAttribute("cx",x);document.getElementById("guideDot").setAttribute("cy",y);const d="M "+sx+" "+sy+" C "+sx+" "+Math.round(h*.72)+", "+x+" "+Math.round(y+100)+", "+x+" "+y;document.getElementById("guideOutline").setAttribute("d",d);document.getElementById("guidePath").setAttribute("d",d)}setTarget('+targetX+','+targetY+')</script></body></html>';
            guideLineWindow.loadURL('data:text/html;charset=utf-8,' + encodeURIComponent(svg));
            const safe = escapeHtml(instruction);
            const card = '<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box}html,body{margin:0;background:transparent;color:#fff;font:11px Segoe UI,Arial}section{background:#080808f2;border:1px solid #888;border-radius:12px;padding:9px;box-shadow:0 4px 22px #0008;-webkit-app-region:drag}strong{font-size:12px}p{line-height:1.3;margin:5px 0}button{background:#1a1a1a;color:#fff;border:1px solid #777;border-radius:7px;padding:5px 8px;cursor:pointer;-webkit-app-region:no-drag}#findStatus{color:#ddd;font-size:10px}</style></head><body><section><strong>☰ Bosley guide · drag this card to move</strong><p>'+safe+'</p><p id="findStatus">Switch to the target app, then select Find target.</p><button id="find">Find target</button> <button onclick="window.close()">Stop</button></section><script>const b=document.getElementById("find"),s=document.getElementById("findStatus");b.onclick=()=>{b.disabled=true;s.textContent="Capturing and analyzing current screen…";location.href="bosley://find-target"}</script></body></html>';
            guideCardWindow = new BrowserWindow({ x: bounds.x + 18, y: bounds.y + 64, width: 270, height: 166, frame: false, transparent: true, resizable: false, movable: true, alwaysOnTop: true, skipTaskbar: true, hasShadow: false, webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true } });
            guideCardWindow.setAlwaysOnTop(true, 'screen-saver');
            guideCardWindow.webContents.on('will-navigate', (event, url) => {
              if (url !== 'bosley://find-target') return;
              event.preventDefault();
              findVisualGuideTarget().then(result => {
                if (!guideCardWindow || guideCardWindow.isDestroyed()) return;
                const status = result.cancelled ? 'Screen capture cancelled.' : result.ok ? ('Target found: ' + result.target + ' (' + Math.round(result.confidence * 100) + '% confidence).') : (result.reason || 'No confident target found. Keep the target app visible and retry.');
                guideCardWindow.webContents.executeJavaScript('document.getElementById("findStatus").textContent=' + JSON.stringify(status) + ';document.getElementById("find").disabled=false;').catch(() => {});
              }).catch(error => {
                if (guideCardWindow && !guideCardWindow.isDestroyed()) guideCardWindow.webContents.executeJavaScript('document.getElementById("findStatus").textContent=' + JSON.stringify(String(error.message || 'Target detection failed.')) + ';document.getElementById("find").disabled=false;').catch(() => {});
              });
            });
            guideCardWindow.loadURL('data:text/html;charset=utf-8,' + encodeURIComponent(card));
            guideTargetWindow = new BrowserWindow({ x: bounds.x + targetX - 18, y: bounds.y + targetY - 18, width: 36, height: 36, frame: false, transparent: true, backgroundColor: '#00000000', resizable: false, movable: true, alwaysOnTop: true, skipTaskbar: true, hasShadow: false, webPreferences: { contextIsolation: true, nodeIntegration: false, sandbox: true } });
            guideTargetWindow.setAlwaysOnTop(true, 'screen-saver');
            const targetHtml = '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{-webkit-app-region:drag;display:grid;place-items:center}div{width:22px;height:22px;border:3px solid #111;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #fff8,0 0 18px #fff}</style></head><body title="Drag this target onto the app control"><div></div></body></html>';
            guideTargetWindow.loadURL('data:text/html;charset=utf-8,' + encodeURIComponent(targetHtml));
            const syncTarget = () => {
              if (!guideTargetWindow || guideTargetWindow.isDestroyed() || !guideLineWindow || guideLineWindow.isDestroyed()) return;
              const b = guideTargetWindow.getBounds();
              targetX = Math.max(12, Math.min(bounds.width - 12, b.x - bounds.x + 18));
              targetY = Math.max(12, Math.min(bounds.height - 12, b.y - bounds.y + 18));
              guideLineWindow.webContents.executeJavaScript('setTarget('+targetX+','+targetY+')').catch(() => {});
            };
            guideTargetWindow.on('move', syncTarget);
            guideCardWindow.on('closed', () => stopVisualGuide());
            guideTargetWindow.on('closed', () => { if (guideLineWindow && !guideLineWindow.isDestroyed()) guideLineWindow.close(); });
            guideLineWindow.on('closed', () => { guideLineWindow = null; });
            return { ok: true, state: 'overlay-opened' };
          }

          function openRestoredUrl(url) {
            if (process.platform === 'win32') {
              const candidates = [
                path.join(process.env.PROGRAMFILES || 'C:\\Program Files', 'Google', 'Chrome', 'Application', 'chrome.exe'),
                path.join(process.env['PROGRAMFILES(X86)'] || 'C:\\Program Files (x86)', 'Google', 'Chrome', 'Application', 'chrome.exe'),
                path.join(process.env.LOCALAPPDATA || '', 'Google', 'Chrome', 'Application', 'chrome.exe')
              ];
              const chrome = candidates.find(candidate => candidate && fs.existsSync(candidate));
              if (chrome) {
                const child = spawn(chrome, ['--new-window', '--window-size=1100,760', '--window-position=70,60', url], { detached: true, stdio: 'ignore', windowsHide: false });
                child.on('error', error => logStartup('CHROME URL OPEN FAILED', error.message));
                child.unref();
                return Promise.resolve({ ok: true, opened: true, browser: 'chrome', windowMode: 'restored' });
              }
            }
            return shell.openExternal(url).then(() => ({ ok: true, opened: true, browser: 'default', windowMode: 'system-default' }));
          }

          function createPanel() {
            panel = new BrowserWindow({
              width: 420,
              height: 460,
              minWidth: 320,
              minHeight: 300,
              resizable: true,
              show: false,
              backgroundColor: '#000000',
              title: 'Bosley Companion',
              autoHideMenuBar: true,
              alwaysOnTop: true,
              webPreferences: {
                preload: path.join(__dirname, 'preload.cjs'),
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: true
              }
            });

            panel.setAlwaysOnTop(true);

            panel.webContents.on('console-message', (_event, level, message, line, sourceId) => {
              logStartup('RENDERER CONSOLE', { level, message, line, sourceId });
            });

            panel.webContents.on(
              'did-fail-load',
              (_event, code, description, failedUrl, isMainFrame) => {
                if (isMainFrame && !String(failedUrl).startsWith('data:')) {
                  const detail = `${code}: ${description} (${failedUrl})`;
                  if (!usingHostedFallback && String(failedUrl).startsWith('file:')) {
                    loadHostedFallback('The bundled interface failed to load: ' + detail);
                  } else {
                    showLoadError(detail);
                  }
                }
              }
            );

            panel.webContents.on(
              'render-process-gone',
              (_event, details) => {
                const detail = `The page process stopped (${details.reason || 'unknown reason'}).`;
                if (!usingHostedFallback) loadHostedFallback(detail);
                else showLoadError(detail);
              }
            );

            panel.webContents.on('did-finish-load', () => {
              if (!panel || panel.isDestroyed()) return;
              const loadedUrl = panel.webContents.getURL();
              logStartup('PAGE LOADED', loadedUrl);
              // A file can load successfully while its UI bootstrap silently fails.
              if (loadedUrl.startsWith('file:') && !usingHostedFallback) {
                setTimeout(() => {
                  if (!panel || panel.isDestroyed() || usingHostedFallback) return;
                  panel.webContents.executeJavaScript("(() => { const b=document.body; const r=b&&b.getBoundingClientRect(); const launch=document.querySelector('#launch'); const root=document.querySelector('#root'); return {childCount:b?.children?.length||0, width:r?.width||0, height:r?.height||0, rootPresent:!!root, launcherFaceReady:!!launch?.querySelector('.hat')}; })()")
                    .then(state => {
                      if (!panel || panel.isDestroyed() || usingHostedFallback) return;
                      if (!state || state.childCount === 0 || state.width === 0 || state.height === 0 || !state.rootPresent || !state.launcherFaceReady) {
                        loadHostedFallback('The local app opened but did not render its interface.');
                      }
                    })
                    .catch(error => loadHostedFallback('Could not verify the local interface: ' + error.message));
                }, 3500);
              }
            });

            panel.webContents.setWindowOpenHandler(({ url }) => {
              let target;
              try { target = new URL(url); } catch {
                return { action: 'deny' };
              }

              if (target.protocol !== 'https:') {
                return { action: 'deny' };
              }

              // Do not let arbitrary page content open links silently.
              dialog.showMessageBox(panel, {
                type: 'question',
                buttons: ['Cancel', 'Open link'],
                defaultId: 0,
                cancelId: 0,
                title: 'Bosley Companion',
                message: 'Allow this page to open an external link?',
                detail: target.href
              }).then(choice => {
                if (choice.response === 1) {
                  return openRestoredUrl(target.href);
                }
              }).catch(error => {
                console.error('External link request failed:', error.message);
              });

              return { action: 'deny' };
            });

            // Never leave a blank native window if the hosted page stalls.
            let mainFrameFinished = false;
            panel.webContents.once('did-finish-load', () => {
              mainFrameFinished = true;
            });
            const startupTimeout = setTimeout(() => {
              if (!mainFrameFinished && panel && !panel.isDestroyed()) {
                showLoadError('The website did not finish loading within 15 seconds. Check your internet connection, then retry.');
              }
            }, 15000);

            panel.webContents.once('did-finish-load', () => clearTimeout(startupTimeout));
            // Prefer the bundled app so the desktop UI does not depend on Vercel
            // being reachable just to render the panel.
            panel.loadFile(path.join(__dirname, 'index.html')).catch(error => {
              clearTimeout(startupTimeout);
              loadHostedFallback('Local app failed to load: ' + error.message);
            });

            panel.on('close', event => {
              if (!app.isQuitting) {
                event.preventDefault();
                panel.hide();
              }
            });

            panel.on('hide', () => {
              if (!app.isQuitting && bubble && !bubble.isDestroyed()) {
                positionWindows();
                bubble.showInactive();
                bubble.setAlwaysOnTop(true, 'screen-saver');
              }
            });

            panel.on('closed', () => {
              panel = null;
              if (!app.isQuitting && bubble && !bubble.isDestroyed()) bubble.showInactive();
            });
          }

          function togglePanel() {
            if (!panel || panel.isDestroyed()) {
              createPanel();
            }

            if (panel.isVisible()) {
              panel.hide();
            } else {
              if (bubble && !bubble.isDestroyed()) bubble.hide();
              positionWindows();
              panel.show();
              panel.focus();
              panel.setAlwaysOnTop(true, 'screen-saver');
            }
          }

          function isTrustedPanelSender(event) {
            const frameUrl = event.senderFrame?.url || '';
            try {
              const parsed = new URL(frameUrl);
              if (parsed.origin === new URL(SITE).origin) return true;
              if (parsed.protocol !== 'file:') return false;

              // The bundled local UI is trusted only when it is this packaged file.
              const localPath = path.resolve(fileURLToPath(parsed));
              const expectedPath = path.resolve(path.join(__dirname, 'index.html'));
              return localPath.toLowerCase() === expectedPath.toLowerCase();
            } catch {
              return false;
            }
          }

          ipcMain.handle('bosley:capabilities', event => {
            if (!isTrustedPanelSender(event)) {
              throw new Error('Untrusted Bosley panel origin');
            }
            return {
              platform: process.platform,
              desktopBridge: true,
              actions: ['get_desktop_info', 'open_external_url', 'set_widget_appearance', 'launch_app', 'capture_screen', 'wake_companion', 'open_visual_guide', 'stop_visual_guide']
            };
          });

          ipcMain.handle('bosley:request', async (event, request) => {
            if (!isTrustedPanelSender(event)) {
              throw new Error('Untrusted Bosley panel origin');
            }
            if (!request || typeof request.action !== 'string') {
              throw new Error('Invalid desktop request');
            }
            if (request.action === 'open_visual_guide') {
              const payload = request.payload || {};
              const instruction = String(payload.instruction || '').trim();
              if (!instruction) throw new Error('A guide instruction is required.');
              return openVisualGuide({ instruction, x: payload.x, y: payload.y, accessToken: payload.accessToken, taskTitle: payload.taskTitle });
            }
            if (request.action === 'stop_visual_guide') {
              stopVisualGuide();
              return { ok: true, state: 'stopped' };
            }
            if (request.action === 'wake_companion') {
              if (panel && !panel.isDestroyed()) {
                if (panel.isMinimized()) panel.restore();
                panel.show();
                panel.focus();
                if (bubble && !bubble.isDestroyed()) bubble.showInactive();
                return { ok: true, state: 'awake' };
              }
              throw new Error('Bosley desktop panel is not available.');
            }
            if (request.action === 'get_desktop_info') {
              const display = screen.getPrimaryDisplay();
              return {
                ok: true,
                platform: process.platform,
                appVersion: app.getVersion(),
                display: {
                  width: display.workAreaSize.width,
                  height: display.workAreaSize.height
                }
              };
            }
            if (request.action === 'capture_screen') {
              if (process.platform !== 'win32') {
                throw new Error('Screen capture is currently supported by the Windows desktop build only.');
              }
              const choice = await dialog.showMessageBox(panel, {
                type: 'question',
                buttons: ['Cancel', 'Capture screen'],
                defaultId: 0,
                cancelId: 0,
                title: 'Bosley Companion — Screen access',
                message: 'Allow Bosley to capture your primary screen?',
                detail: 'The screenshot will be attached to this chat for your review. It will not be sent until you press Send.'
              });
              if (choice.response !== 1) return { ok: false, cancelled: true };
              const primaryId = String(screen.getPrimaryDisplay().id);
              const sources = await desktopCapturer.getSources({
                types: ['screen'],
                thumbnailSize: { width: 1280, height: 720 },
                fetchWindowIcons: false
              });
              const source = sources.find(item => String(item.display_id) === primaryId) || sources[0];
              if (!source || source.thumbnail.isEmpty()) {
                throw new Error('Windows did not provide a screen image. Check display permissions and try again.');
              }
              const thumbnail = source.thumbnail.resize({ width: 1280, height: 720 }).toJPEG(72);
              return {
                ok: true,
                dataUrl: 'data:image/jpeg;base64,' + thumbnail.toString('base64'),
                width: source.thumbnail.getSize().width,
                height: source.thumbnail.getSize().height
              };
            }
            if (request.action === 'set_widget_appearance') {
              const payload = request.payload || {};
              const allowedSizes = ['compact', 'default', 'wide'];
              const allowedEdges = ['soft', 'balanced', 'sharp'];
              const allowedBorders = ['thin', 'medium', 'bold'];
              if (!allowedSizes.includes(payload.size) ||
                  !allowedEdges.includes(payload.edge) ||
                  !allowedBorders.includes(payload.border)) {
                throw new Error('Invalid widget appearance settings');
              }
              widgetAppearance = {
                size: payload.size,
                edge: payload.edge,
                border: payload.border
              };
              const dimensions = WIDGET_SIZES[widgetAppearance.size];
              if (bubble && !bubble.isDestroyed()) {
                const bounds = screen.getPrimaryDisplay().bounds;
                bubble.setBounds({
                  x: bounds.x + Math.round((bounds.width - dimensions.width) / 2),
                  y: bounds.y,
                  width: dimensions.width,
                  height: dimensions.height
                });
                bubble.webContents.send('bosley:widget-appearance', widgetAppearance);
                bubble.setAlwaysOnTop(true, 'screen-saver');
              }
              return { ok: true, appearance: widgetAppearance };
            }
            if (request.action === 'launch_app') {
              const appId = String(request.payload?.app || '').toLowerCase().trim();
              // Fixed executable allowlist only: never accept paths, arguments, or shell commands from chat.
              if (process.platform !== 'win32') {
                throw new Error('App launching is currently supported by the Windows desktop build only.');
              }
              const apps = {
                chrome: {
                  label: 'Google Chrome',
                  candidates: [
                    path.join(process.env.PROGRAMFILES || 'C:\Program Files', 'Google', 'Chrome', 'Application', 'chrome.exe'),
                    path.join(process.env['PROGRAMFILES(X86)'] || 'C:\Program Files (x86)', 'Google', 'Chrome', 'Application', 'chrome.exe'),
                    path.join(process.env.LOCALAPPDATA || '', 'Google', 'Chrome', 'Application', 'chrome.exe')
                  ]
                },
                edge: {
                  label: 'Microsoft Edge',
                  candidates: [
                    path.join(process.env.PROGRAMFILES || 'C:\Program Files', 'Microsoft', 'Edge', 'Application', 'msedge.exe'),
                    path.join(process.env['PROGRAMFILES(X86)'] || 'C:\Program Files (x86)', 'Microsoft', 'Edge', 'Application', 'msedge.exe')
                  ]
                },
                notepad: {
                  label: 'Notepad',
                  candidates: [path.join(process.env.WINDIR || 'C:\Windows', 'System32', 'notepad.exe')]
                },
                calculator: {
                  label: 'Calculator',
                  candidates: [path.join(process.env.WINDIR || 'C:\Windows', 'System32', 'calc.exe')]
                },
                explorer: {
                  label: 'File Explorer',
                  candidates: [path.join(process.env.WINDIR || 'C:\Windows', 'explorer.exe')]
                }
              };
              const target = apps[appId];
              if (!target) throw new Error('Supported Windows apps: Chrome, Edge, Notepad, Calculator, and File Explorer.');
              const choice = await dialog.showMessageBox(panel, {
                type: 'question',
                buttons: ['Cancel', 'Open app'],
                defaultId: 0,
                cancelId: 0,
                title: 'Bosley Companion',
                message: 'Allow Bosley to launch ' + target.label + '?',
                detail: 'Only this approved application can be launched. Bosley will not run arbitrary commands or paths.'
              });
              if (choice.response !== 1) return { ok: false, cancelled: true };
              const executable = target.candidates.find(candidate => candidate && fs.existsSync(candidate));
              if (!executable) throw new Error(target.label + ' was not found in its standard Windows installation folders.');
              const launchArgs = appId === 'chrome' ? ['--new-window', '--window-size=1100,760', '--window-position=70,60'] : [];
              const child = spawn(executable, launchArgs, { detached: true, stdio: 'ignore', windowsHide: false });
              child.on('error', () => {});
              child.unref();
              return { ok: true, launched: appId, label: target.label };
            }
            if (request.action === 'open_external_url') {
              const rawUrl = String(request.payload?.url || '');
              let target;
              try { target = new URL(rawUrl); } catch {
                throw new Error('A valid HTTPS URL is required');
              }
              if (target.protocol !== 'https:') {
                throw new Error('Only HTTPS links can be opened');
              }
              const choice = await dialog.showMessageBox(panel, {
                type: 'question',
                buttons: ['Cancel', 'Open link'],
                defaultId: 0,
                cancelId: 0,
                title: 'Bosley Companion',
                message: 'Allow Bosley to open this external link?',
                detail: target.href
              });
              if (choice.response !== 1) return { ok: false, cancelled: true };
              await shell.openExternal(target.href);
              return { ok: true, opened: true };
            }
            throw new Error('Desktop action is not allowlisted');
          });

          app.whenReady().then(() => {
            createBubble();
            createPanel();
            positionWindows();

            ipcMain.on('toggle-panel', togglePanel);

            screen.on('display-metrics-changed', positionWindows);
            screen.on('display-added', positionWindows);
            screen.on('display-removed', positionWindows);
          });

          app.on('before-quit', () => {
            app.isQuitting = true;
          });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });
          MAIN_EOF

          cat > desktop/preload.cjs <<'PRELOAD_EOF'
          const { contextBridge, ipcRenderer } = require('electron');

          const desktopBridge = Object.freeze({
            togglePanel: () => ipcRenderer.send('toggle-panel'),
            getCapabilities: () => ipcRenderer.invoke('bosley:capabilities'),
            request: request => ipcRenderer.invoke('bosley:request', request),
            onWidgetAppearance: callback => {
              if (typeof callback !== 'function') return () => {};
              const listener = (_event, appearance) => callback(appearance);
              ipcRenderer.on('bosley:widget-appearance', listener);
              return () => ipcRenderer.removeListener('bosley:widget-appearance', listener);
            }
          });

          contextBridge.exposeInMainWorld('bosleyDesktop', desktopBridge);
          contextBridge.exposeInMainWorld('BosleyDesktop', desktopBridge);
          PRELOAD_EOF

          cat > desktop/bubble.html <<'BUBBLE_EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">

            <style>
              * {
                box-sizing: border-box;
              }

              html,
              body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
              }

              body {
                display: grid;
                place-items: center;
                -webkit-app-region: drag;
              }

              button {
                position: relative;
                isolation: isolate;
                width: 176px;
                height: 40px;
                padding: 3px 12px;
                border: 0;
                border-left: var(--widget-border-width, 1px) solid rgba(255,255,255,.88);
                border-right: var(--widget-border-width, 1px) solid rgba(255,255,255,.88);
                border-bottom: var(--widget-border-width, 1px) solid rgba(255,255,255,.88);
                border-top: 0;
                border-radius: 0 0 28px 28px;
                background: #030303;
                color: #fff;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                -webkit-app-region: no-drag;
                box-shadow: 0 8px 20px rgba(0,0,0,.3), 0 1px 8px rgba(255,255,255,.12);
                transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
              }

              /* Top edge merges into the display bezel; lower edge flows into a smooth island. */
              button::before {
                content: "";
                position: absolute;
                z-index: -1;
                inset: 0 -1px -1px;
                border-radius: 0 0 29px 29px;
                background: #030303;
                box-shadow: inset 0 -1px 0 rgba(255,255,255,.08);
              }

              button:hover {
                border-color: rgba(255,255,255,1);
                box-shadow: 0 8px 24px rgba(0,0,0,.38), 0 1px 10px rgba(255,255,255,.2);
              }

              .wordmark { display: none; }
              /* Island touches the physical top edge: no top border or floating gap. */
              button { width: 260px; height: 36px; padding: 2px 8px; border-left: 1px solid rgba(255,255,255,.72); border-right: 1px solid rgba(255,255,255,.72); border-bottom: 1px solid rgba(255,255,255,.72); border-top: 0; border-radius: 0 0 24px 24px; gap: 0; background: rgba(5,5,5,.99); box-shadow: 0 5px 18px rgba(0,0,0,.34), 0 0 12px rgba(255,255,255,.06); }
              button::before { border-radius: 0 0 24px 24px; }
              svg { display: none !important; }

              button:hover {
                border-color: #fff;
              }

              button:focus-visible {
                outline: 2px solid #fff;
                outline-offset: 2px;
              }

              svg { display: none !important; }
            </style>
          </head>

          <body>
            <button
              aria-label="Open Bosley Companion"
              title="Open Bosley Companion"
            >
              <svg
                viewBox="0 0 108 64"
                role="img"
                aria-label="Bosley incognito fedora with two white vertical eyes"
              >
                <path d="M31 28 L42 7 Q44 4 48 7 L54 11 L61 7 Q65 4 67 8 L78 28 Z"
                  fill="#050505" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M36 21 Q54 23 73 21 L78 28 L31 28 Z"
                  fill="#171717" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/>
                <path d="M8 34 Q19 27 40 27 L68 27 Q89 27 100 34 Q79 40 54 40 Q29 40 8 34 Z"
                  fill="#050505" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M39 30 Q54 32 69 30" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
                <rect x="35" y="29" width="13" height="30" rx="6.5" fill="#fff"/>
                <rect x="60" y="29" width="13" height="30" rx="6.5" fill="#fff"/>
              </svg>
              <span class="wordmark">BOSLEY</span>
            </button>

            <script>
              const button = document.querySelector('button');
              const sizes = {
                compact: { width: 96, height: 26 },
                default: { width: 104, height: 28 },
                wide: { width: 128, height: 32 }
              };
              function applyAppearance(value) {
                if (!value) return;
                const size = sizes[value.size] || sizes.default;
                document.documentElement.style.setProperty('--widget-radius',
                  ({ soft: '24px', balanced: '12px', sharp: '3px' })[value.edge] || '3px');
                document.documentElement.style.setProperty('--widget-border-width',
                  ({ thin: '1px', medium: '2px', bold: '3px' })[value.border] || '1px');
                button.style.width = size.width + 'px';
                button.style.height = size.height + 'px';
                document.querySelector('svg').style.width = Math.max(38, Math.min(52, Math.round(size.width * 0.27))) + 'px';
                document.querySelector('svg').style.height = Math.max(24, Math.min(30, size.height - 10)) + 'px';
              }
              if (window.bosleyDesktop.onWidgetAppearance) {
                window.bosleyDesktop.onWidgetAppearance(applyAppearance);
              }
              document.querySelector('button').addEventListener('click', () => {
                window.bosleyDesktop.togglePanel();
              });
            </script>
          </body>
          </html>
          BUBBLE_EOF

      - name: Verify generated desktop bridge before packaging
        shell: bash
        run: |
          test -s desktop/main.cjs
          test -s desktop/preload.cjs
          test -s desktop/bubble.html
          test -s desktop/index.html
          test -d desktop/assets
          grep -q '<script' desktop/index.html
          grep -q '</html>' desktop/index.html
          grep -Fq 'id="startup-error"' desktop/index.html
          grep -Fq 'id="voicemodes"' desktop/index.html
          grep -Fq 'id="activitytoggle"' desktop/index.html
          grep -Fq 'function activityEvent' desktop/index.html
          grep -Fq 'function setVoiceMode(next)' desktop/index.html
          grep -Fq 'aria-label="Open Bosley Companion"' desktop/bubble.html
          grep -Fq 'openRestoredUrl' desktop/main.cjs
          grep -Fq 'window-size=1100,760' desktop/main.cjs
          grep -Fq 'loadHostedFallback' desktop/main.cjs
          grep -Fq 'The local app opened but did not render its interface.' desktop/main.cjs
          grep -Fq './assets/supabase.js' desktop/index.html
          test -s desktop/assets/supabase.js
          grep -Fq "panel.loadFile(path.join(__dirname, 'index.html'))" desktop/main.cjs
          grep -Fq "bosley:capabilities" desktop/main.cjs
          grep -Fq "bosley:request" desktop/main.cjs
          grep -Fq "get_desktop_info" desktop/main.cjs
          grep -Fq "open_external_url" desktop/main.cjs
          grep -Fq "set_widget_appearance" desktop/main.cjs
          grep -Fq "launch_app" desktop/main.cjs
          grep -Fq "capture_screen" desktop/main.cjs
          grep -Fq "wake_companion" desktop/main.cjs
          grep -Fq "onWidgetAppearance" desktop/preload.cjs
          grep -Fq "contextIsolation: true" desktop/main.cjs
          grep -Fq "nodeIntegration: false" desktop/main.cjs
          grep -Fq "sandbox: true" desktop/main.cjs
          grep -Fq "getCapabilities" desktop/preload.cjs
          grep -Fq "contextBridge.exposeInMainWorld('BosleyDesktop'" desktop/preload.cjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          echo "Desktop bridge source and JavaScript syntax checks passed."

      - name: Generate Bosley app icon
        shell: bash
        run: |
          python -m pip install Pillow
          python scripts/generate-app-icons.py
          cp assets/icons/bosley.ico desktop/assets/bosley.ico

      - name: Install dependencies and build installer
        shell: bash
        run: |
          cd desktop
          npm install
          # Retry transient upstream HTTP 5xx failures from electron-builder's
          # Windows NSIS resource/signing download. Keep the build failure hard
          # if all attempts fail; never upload a partial installer.
          attempt=1
          until npm run dist; do
            if [ "$attempt" -ge 3 ]; then
              echo "Windows installer packaging failed after $attempt attempts."
              exit 1
            fi
            echo "Installer packaging failed (attempt $attempt); retrying in 15 seconds..."
            sleep 15
            attempt=$((attempt + 1))
          done

      - name: Verify Windows installer and unpacked executable
        shell: bash
        run: |
          test -d desktop/dist/win-unpacked
          test -s "desktop/dist/win-unpacked/Bosley Companion.exe"
          installer="$(find desktop/dist -maxdepth 1 -type f -name '*.exe' -size +1k -print -quit)"
          test -n "$installer"
          test -s "$installer"
          echo "Installer artifact verified: $installer"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Bosley-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Package optional Bosley Agent Pack
        shell: bash
        run: |
          test -s agent-pack/README.md
          test -s agent-pack/skills.json
          python - <<'PY'
          import json
          with open('agent-pack/skills.json', encoding='utf-8') as handle:
              pack = json.load(handle)
          assert pack.get('version') == 1 and len(pack.get('skills', [])) >= 5
          with open('agent-pack/bosley-app.json', encoding='utf-8') as handle:
              app = json.load(handle)
          assert 'url' in app
          PY
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path('agent-pack')
          with ZipFile('Bosley-Optional-Agent-Pack.zip', 'w', ZIP_DEFLATED) as archive:
              for file in sorted(root.rglob('*')):
                  if file.is_file():
                      archive.write(file, file.relative_to(root))
          print('Created Bosley-Optional-Agent-Pack.zip')
          PY

      - name: Upload optional agent pack
        uses: actions/upload-artifact@v4
        with:
          name: Bosley-Optional-Agent-Pack
          path: Bosley-Optional-Agent-Pack.zip
          if-no-files-found: error
          retention-days: 30
