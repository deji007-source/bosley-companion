                width: 92, height: 48, frame: false, transparent: true, resizable: false,
                movable: true, alwaysOnTop: true, skipTaskbar: true, hasShadow: false,
                backgroundColor: '#00000000',
                webPreferences: { preload: path.join(__dirname, 'preload.cjs'), contextIsolation: true, nodeIntegration: false, sandbox: true }
              });
              pendingScreenCaptureResolve = finish;
              confirmation.setAlwaysOnTop(true, 'screen-saver');
              const prompt = '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{display:grid;place-items:center;-webkit-app-region:drag}button{-webkit-app-region:no-drag;width:76px;height:36px;border:1px solid #333;border-radius:11px;background:#fff;color:#080808;font:700 13px system-ui;box-shadow:0 4px 18px #0008;cursor:pointer}</style></head><body><button type="button" onclick="window.bosleyDesktop.confirmScreenCapture()">OK</button></body></html>';
              confirmation.loadURL('data:text/html;charset=utf-8,' + encodeURIComponent(prompt)).then(() => {
                if (!confirmation.isDestroyed()) {
                  const area = screen.getPrimaryDisplay().workArea;
                  confirmation.setPosition(area.x + area.width - 112, area.y + Math.round(area.height * .42));
                  confirmation.setAlwaysOnTop(true, 'screen-saver');
                  confirmation.showInactive();
                }
              }).catch(() => finish(false));
              confirmation.on('closed', () => finish(false));
            });
          }
          ipcMain.on('bosley:capture-confirmed', () => {
            if (pendingScreenCaptureResolve) pendingScreenCaptureResolve(true);
          });

          const floatingViewWindows = new Map();
          const floatingViewBoundsFile = path.join(app.getPath('userData'), 'floating-view-bounds.json');
          function saveFloatingViewBounds(viewId, target) {
            if (!target || target.isDestroyed() || target.isMaximized() || target.isMinimized()) return;
            try {
              let all = {};
              try { all = JSON.parse(fs.readFileSync(floatingViewBoundsFile, 'utf8')) || {}; } catch {}
              all[viewId] = target.getBounds();
              fs.mkdirSync(path.dirname(floatingViewBoundsFile), { recursive: true });
              fs.writeFileSync(floatingViewBoundsFile, JSON.stringify(all, null, 2), 'utf8');
            } catch (error) { logStartup('FLOATING VIEW BOUNDS SAVE FAILED', viewId, error.message); }
          }
          const FLOATING_VIEW_IDS = ['lovable-bosley','ws','facepanel','agents-panel','automation','activity','skills-panel','bosley-search','control-centre','universal-input','writing-assist'];
          function openFloatingView(viewId) {
            if (!FLOATING_VIEW_IDS.includes(viewId)) throw new Error('Unknown Bosley side view.');
            const existing = floatingViewWindows.get(viewId);
            if (existing && !existing.isDestroyed()) {
              if (existing.isMinimized()) existing.restore();
              existing.show();
              existing.focus();
              return { ok: true, reused: true, view: viewId };
            }
            const index = FLOATING_VIEW_IDS.indexOf(viewId);
            const display = screen.getPrimaryDisplay();
            const area = display.workArea;
            // Detached pages are compact, near-square utility windows anchored at
            // the top centre. They remain resizable; do not inherit old oversized bounds.
            const width = Math.min(480, Math.max(400, area.width - 32));
            const height = Math.min(520, Math.max(420, area.height - 56));
            const savedBounds = (() => {
              try {
                const all = JSON.parse(fs.readFileSync(floatingViewBoundsFile, 'utf8'));
                const b = all && all[viewId];
                if (b && Number.isFinite(b.x) && Number.isFinite(b.y) && Number.isFinite(b.width) && Number.isFinite(b.height)) return b;
              } catch {}
              return null;
            })();
            const savedWidth = Math.min(Math.min(area.width - 16, 680), Math.max(400, savedBounds?.width ?? width));
            const savedHeight = Math.min(Math.min(area.height - 16, 720), Math.max(420, savedBounds?.height ?? height));
            const maxX = Math.max(area.x + 8, area.x + area.width - savedWidth - 8);
            const maxY = Math.max(area.y + 8, area.y + area.height - savedHeight - 8);
            const x = Math.max(area.x + 8, Math.min(maxX, savedBounds?.x ?? (area.x + Math.round((area.width - savedWidth) / 2))));
            const y = Math.max(area.y + 8, Math.min(maxY, savedBounds?.y ?? (area.y + 42)));
            const startWidth = savedWidth;
            const startHeight = savedHeight;
            const win = new BrowserWindow({
              x, y, width: startWidth, height: startHeight, minWidth: 360, minHeight: 360,
              frame: false, show: false, resizable: true, movable: true,
              alwaysOnTop: false, skipTaskbar: false, backgroundColor: '#050505',
              title: 'Bosley — ' + viewId,
              webPreferences: {
                preload: path.join(__dirname, 'preload.cjs'),
                contextIsolation: true, nodeIntegration: false, sandbox: true
              }
            });
            floatingViewWindows.set(viewId, win);
            const persistBounds = () => saveFloatingViewBounds(viewId, win);
            win.on('move', persistBounds);
            win.on('resize', persistBounds);
            win.on('close', persistBounds);
            win.on('closed', () => {
              if (floatingViewWindows.get(viewId) === win) floatingViewWindows.delete(viewId);
            });
            win.webContents.on('console-message', (_event, level, message) => {
              if (level >= 2) logStartup('FLOATING VIEW ERROR', viewId, message);
            });
            win.webContents.on('did-fail-load', (_event, code, description, url, isMainFrame) => {
              if (isMainFrame) logStartup('FLOATING VIEW NAVIGATION FAILED', viewId, { code, description, url });
            });
            win.webContents.on('render-process-gone', (_event, details) => logStartup('FLOATING VIEW RENDERER STOPPED', viewId, details));
            win.loadFile(path.join(__dirname, 'index.html'), { query: { bosleyFloat: viewId } })
              .then(() => { if (!win.isDestroyed()) { win.show(); win.focus(); logStartup('FLOATING VIEW SHOWN', viewId, win.getBounds()); } })
              .catch(error => {
                logStartup('FLOATING VIEW LOAD FAILED', viewId, error.message);
                if (!win.isDestroyed()) win.close();
              });
            return { ok: true, opened: true, view: viewId, position: { x, y } };
          }

          ipcMain.handle('bosley:request', async (event, request) => {
            if (!isTrustedPanelSender(event)) {
              throw new Error('Untrusted Bosley panel origin');
            }
            if (!request || typeof request.action !== 'string') {
              throw new Error('Invalid desktop request');
            }
            if (request.action === 'open_floating_view') {
              const viewId = String(request.payload?.view || '');
              return openFloatingView(viewId);
            }
            if (request.action === 'close_floating_view') {
              const senderWindow = BrowserWindow.fromWebContents(event.sender);
              const ownedWindow = [...floatingViewWindows.values()].includes(senderWindow);
              if (ownedWindow && !senderWindow.isDestroyed()) senderWindow.close();
              return { ok: ownedWindow };
            }
            if (request.action === 'floating_view_control') {
              const senderWindow = BrowserWindow.fromWebContents(event.sender);
              const ownedEntry = [...floatingViewWindows.entries()].find(([, target]) => target === senderWindow);
              if (!ownedEntry || senderWindow.isDestroyed()) return { ok: false };
              const command = String(request.payload?.command || '');
              if (command === 'minimize') senderWindow.minimize();
              else if (command === 'maximize') { if (!senderWindow.isMaximized()) senderWindow.maximize(); }
              else if (command === 'restore') { if (senderWindow.isMaximized() || senderWindow.isMinimized()) senderWindow.restore(); }
              else if (command === 'close') senderWindow.close();
              else throw new Error('Unsupported floating window command.');
              return { ok: true, command };
            }
            if (request.action === 'open_visual_guide') {
              const payload = request.payload || {};
              const instruction = String(payload.instruction || '').trim();
              if (!instruction) throw new Error('A guide instruction is required.');
              return openVisualGuide({ instruction, x: payload.x, y: payload.y, accessToken: payload.accessToken, taskTitle: payload.taskTitle });
            }
            if (request.action === 'stop_visual_guide') {
              stopVisualGuide();
              return { ok: true, state: 'stopped' };
            }
            if (request.action === 'find_visual_guide_target') {
              if (!guideCardWindow || guideCardWindow.isDestroyed()) throw new Error('Start a visual guide before checking its target.');
              const result = await findVisualGuideTarget();
              if (guideCardWindow && !guideCardWindow.isDestroyed()) {
                const status = result.cancelled ? 'Screen capture cancelled.' : result.ok ? ('Target found: ' + result.target + ' (' + Math.round(result.confidence * 100) + '% confidence).') : (result.reason || 'No confident target found. Keep the target app visible and retry.');
                guideCardWindow.webContents.executeJavaScript('document.getElementById("findStatus").textContent=' + JSON.stringify(status) + ';document.getElementById("find").disabled=false;' + (result.ok ? 'window.bosleySetTarget(' + JSON.stringify(String(result.target || 'matching control').slice(0,100)) + ',' + (Number(result.confidence) || 0) + ');' : '')).catch(() => {});
              }
              return result;
            }

            if (request.action === 'wake_companion') {
              if (!panel || panel.isDestroyed()) throw new Error('Bosley desktop panel is not available.');
              if (panel.isMinimized()) panel.restore();
              panel.show();
              panel.focus();
              if (bubble && !bubble.isDestroyed()) bubble.showInactive();
              if (!walkingCompanion || walkingCompanion.isDestroyed()) {
                setWalkingCompanionEnabled(true);
              } else {
                walkingCompanion.showInactive();
                walkingCompanion.setAlwaysOnTop(true, 'screen-saver');
                walkingCompanion.moveTop();
              }
              return { ok: true, state: 'awake', floatingCompanion: true };
            }
            if (request.action === 'get_desktop_info') {
              const display = screen.getPrimaryDisplay();
              return {
                ok: true,
                platform: process.platform,
                appVersion: app.getVersion(),
                display: {
                  width: display.workAreaSize.width,
                  height: display.workAreaSize.height
                }
              };
            }
            if (request.action === 'capture_screen') {
              if (process.platform !== 'win32') {
                throw new Error('Screen capture is currently supported by the Windows desktop build only.');
              }
              const confirmed = await showScreenCaptureConfirmation();
              if (!confirmed) return { ok: false, cancelled: true };
              await new Promise(resolve => setTimeout(resolve, 180));
              const primaryDisplay = screen.getPrimaryDisplay();
              const primaryId = String(primaryDisplay.id);
              const captureWidth = 1280;
              const captureHeight = Math.max(1, Math.round(captureWidth * primaryDisplay.bounds.height / primaryDisplay.bounds.width));
              const sources = await desktopCapturer.getSources({
                types: ['screen'],
                thumbnailSize: { width: captureWidth, height: captureHeight },
                fetchWindowIcons: false
              });
              const source = sources.find(item => String(item.display_id) === primaryId) || sources[0];
              if (!source || source.thumbnail.isEmpty()) {
                throw new Error('Windows did not provide a screen image. Check display permissions and try again.');
              }
              const thumbnail = source.thumbnail.resize({ width: captureWidth, height: captureHeight }).toJPEG(72);
              return {
                ok: true,
                dataUrl: 'data:image/jpeg;base64,' + thumbnail.toString('base64'),
                width: source.thumbnail.getSize().width,
                height: source.thumbnail.getSize().height
              };
            }
            if (request.action === 'set_widget_appearance') {
              const payload = request.payload || {};
              const allowedSizes = ['compact', 'default', 'wide'];
              const allowedEdges = ['soft', 'balanced', 'sharp'];
              const allowedBorders = ['thin', 'medium', 'bold'];
              if (!allowedSizes.includes(payload.size) ||
                  !allowedEdges.includes(payload.edge) ||
                  !allowedBorders.includes(payload.border)) {
                throw new Error('Invalid widget appearance settings');
              }
              widgetAppearance = {
                size: payload.size,
                edge: payload.edge,
                border: payload.border
              };
              const dimensions = WIDGET_SIZES[widgetAppearance.size];
              if (bubble && !bubble.isDestroyed()) {
                const bounds = screen.getPrimaryDisplay().bounds;
                bubble.setBounds({
                  x: bounds.x + Math.round((bounds.width - dimensions.width) / 2),
                  y: bounds.y,
                  width: dimensions.width,
                  height: dimensions.height
                });
                bubble.webContents.send('bosley:widget-appearance', widgetAppearance);
                bubble.setAlwaysOnTop(true, 'screen-saver');
              }
              return { ok: true, appearance: widgetAppearance };
            }
            if (request.action === 'launch_app') {
              const appId = String(request.payload?.app || '').toLowerCase().trim();
              // Fixed executable allowlist only: never accept paths, arguments, or shell commands from chat.
              if (process.platform !== 'win32') {
                throw new Error('App launching is currently supported by the Windows desktop build only.');
              }
              const apps = {
                chrome: {
                  label: 'Google Chrome',
                  candidates: [
                    path.join(process.env.PROGRAMFILES || 'C:\Program Files', 'Google', 'Chrome', 'Application', 'chrome.exe'),
                    path.join(process.env['PROGRAMFILES(X86)'] || 'C:\Program Files (x86)', 'Google', 'Chrome', 'Application', 'chrome.exe'),
                    path.join(process.env.LOCALAPPDATA || '', 'Google', 'Chrome', 'Application', 'chrome.exe')
                  ]
                },
                edge: {
                  label: 'Microsoft Edge',
                  candidates: [
                    path.join(process.env.PROGRAMFILES || 'C:\Program Files', 'Microsoft', 'Edge', 'Application', 'msedge.exe'),
                    path.join(process.env['PROGRAMFILES(X86)'] || 'C:\Program Files (x86)', 'Microsoft', 'Edge', 'Application', 'msedge.exe')
                  ]
                },
                notepad: {
                  label: 'Notepad',
                  candidates: [path.join(process.env.WINDIR || 'C:\Windows', 'System32', 'notepad.exe')]
                },
                calculator: {
                  label: 'Calculator',
                  candidates: [path.join(process.env.WINDIR || 'C:\Windows', 'System32', 'calc.exe')]
                },
                explorer: {
                  label: 'File Explorer',
                  candidates: [path.join(process.env.WINDIR || 'C:\Windows', 'explorer.exe')]
                }
              };
              const target = apps[appId];
              if (!target) throw new Error('Supported Windows apps: Chrome, Edge, Notepad, Calculator, and File Explorer.');
              const choice = await dialog.showMessageBox(panel, {
                type: 'question',
                buttons: ['Cancel', 'Open app'],
                defaultId: 0,
                cancelId: 0,
                title: 'Bosley Companion',
                message: 'Allow Bosley to launch ' + target.label + '?',
                detail: 'Only this approved application can be launched. Bosley will not run arbitrary commands or paths.'
              });
              if (choice.response !== 1) return { ok: false, cancelled: true };
              const executable = target.candidates.find(candidate => candidate && fs.existsSync(candidate));
              if (!executable) throw new Error(target.label + ' was not found in its standard Windows installation folders.');
              const launchArgs = appId === 'chrome' ? ['--new-window', '--window-size=1100,760', '--window-position=70,60'] : [];
              const child = spawn(executable, launchArgs, { detached: true, stdio: 'ignore', windowsHide: false });
              child.on('error', () => {});
              child.unref();
              return { ok: true, launched: appId, label: target.label };
            }
            if (request.action === 'clipboard_read') {
              // Read only in response to an explicit user action from the trusted panel.
              const text = clipboard.readText().slice(0, 12000);
              return { ok: true, text };
            }
            if (request.action === 'clipboard_write') {
              const text = String(request.payload?.text || '');
              if (!text || text.length > 12000) throw new Error('Clipboard text must contain between 1 and 12000 characters.');
              clipboard.writeText(text);
              return { ok: true, characters: text.length };
            }
            if (request.action === 'open_external_url') {
              const rawUrl = String(request.payload?.url || '');
              let target;
              try { target = new URL(rawUrl); } catch {
                throw new Error('A valid HTTPS URL is required');
              }
              if (!['https:', 'mailto:', 'sms:'].includes(target.protocol)) {
                throw new Error('Only HTTPS, email and SMS composer links can be opened');
              }
              const choice = await dialog.showMessageBox(panel, {
                type: 'question',
                buttons: ['Cancel', 'Open link'],
                defaultId: 0,
                cancelId: 0,
                title: 'Bosley Companion',
                message: 'Allow Bosley to open this external link?',
                detail: target.href
              });
              if (choice.response !== 1) return { ok: false, cancelled: true };
              await shell.openExternal(target.href);
              return { ok: true, opened: true };
            }
            throw new Error('Desktop action is not allowlisted');
          });

          app.whenReady().then(() => {
            createBubble();
            createPanel();
            if (walkingCompanionEnabled) createWalkingCompanion();
            const shortcutRegistered = globalShortcut.register('CommandOrControl+Alt+B', toggleWalkingCompanion);
            if (!shortcutRegistered) logStartup('COMPANION SHORTCUT REGISTRATION FAILED');
            const writingShortcutRegistered = globalShortcut.register('CommandOrControl+Shift+U', openUniversalInput);
            if (!writingShortcutRegistered) logStartup('UNIVERSAL INPUT SHORTCUT REGISTRATION FAILED');
            const floatingBulbShortcutRegistered = globalShortcut.register('CommandOrControl+Shift+I', toggleWritingBulb);
            if (!floatingBulbShortcutRegistered) logStartup('FLOATING WRITING BULB SHORTCUT REGISTRATION FAILED');
            positionWindows();

            ipcMain.on('toggle-panel', togglePanel);
            ipcMain.on('bosley:open-writing', openWritingAssistantFromBulb);
            ipcMain.on('bosley:show-writing-bulb', showWritingBulbForFiveSeconds);
            ipcMain.on('bosley:panel-activity', event => {
              if (panel && !panel.isDestroyed() && event.sender === panel.webContents && panel.isVisible()) armPanelIdleClose();
            });
            ipcMain.on('bosley:companion-state', (_event, state) => {
              const allowedStates = new Set(['idle','listening','thinking','speaking','working','waiting','success','error','walk']);
              if (!allowedStates.has(state)) return;
              if (walkingCompanion && !walkingCompanion.isDestroyed()) {
                walkingCompanion.webContents.send('bosley:companion-state-update', state);
              }
            });

            screen.on('display-metrics-changed', positionWindows);
            screen.on('display-added', positionWindows);
            screen.on('display-removed', positionWindows);
          });

          app.on('before-quit', () => {
            app.isQuitting = true;
            globalShortcut.unregisterAll();
            });

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') {
              app.quit();
            }
          });
          MAIN_EOF

          cat > desktop/preload.cjs <<'PRELOAD_EOF'
          const { contextBridge, ipcRenderer } = require('electron');

          const desktopBridge = Object.freeze({
            togglePanel: () => ipcRenderer.send('toggle-panel'),
            openWritingAssistant: () => ipcRenderer.send('bosley:open-writing'),
            showWritingBulb: () => ipcRenderer.send('bosley:show-writing-bulb'),
            getCapabilities: () => ipcRenderer.invoke('bosley:capabilities'),
            request: request => ipcRenderer.invoke('bosley:request', request),
            confirmScreenCapture: () => ipcRenderer.send('bosley:capture-confirmed'),
            setCompanionState: state => {
              const allowed = ['idle','listening','thinking','speaking','working','waiting','success','error','walk'];
              if (allowed.includes(state)) ipcRenderer.send('bosley:companion-state', state);
            },
            onCompanionState: callback => {
              if (typeof callback !== 'function') return () => {};
              const listener = (_event, state) => callback(state);
              ipcRenderer.on('bosley:companion-state-update', listener);
              return () => ipcRenderer.removeListener('bosley:companion-state-update', listener);
            },
            onWidgetAppearance: callback => {
              if (typeof callback !== 'function') return () => {};
              const listener = (_event, appearance) => callback(appearance);
              ipcRenderer.on('bosley:widget-appearance', listener);
              return () => ipcRenderer.removeListener('bosley:widget-appearance', listener);
            }
          });

          const reportPanelActivity = () => ipcRenderer.send('bosley:panel-activity');
          window.addEventListener('DOMContentLoaded', () => {
            for (const eventName of ['pointerdown','keydown','input','change','scroll','wheel','touchstart']) {
              document.addEventListener(eventName, reportPanelActivity, { capture: true, passive: true });
            }
          }, { once: true });

          contextBridge.exposeInMainWorld('bosleyDesktop', desktopBridge);
          contextBridge.exposeInMainWorld('BosleyDesktop', desktopBridge);
          PRELOAD_EOF

          cat > desktop/bubble.html <<'BUBBLE_EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">

            <style>
              * {
                box-sizing: border-box;
              }

              html,
              body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: transparent;
              }

              body {
                display: grid;
                place-items: center;
                -webkit-app-region: drag;
              }

              button {
                position: relative;
                isolation: isolate;
                width: 176px;
                height: 40px;
                padding: 3px 12px;
                border: 0;
                border-left: var(--widget-border-width, 1px) solid rgba(255,255,255,.88);
                border-right: var(--widget-border-width, 1px) solid rgba(255,255,255,.88);
                border-bottom: var(--widget-border-width, 1px) solid rgba(255,255,255,.88);
                border-top: 0;
                border-radius: 0 0 999px 999px;
                background: #030303;
                color: #fff;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                -webkit-app-region: no-drag;
                box-shadow: 0 8px 20px rgba(0,0,0,.3), 0 1px 8px rgba(255,255,255,.12);
                transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
              }

              /* Top edge merges into the display bezel; lower edge flows into a smooth island. */
              button::before {
                content: "";
                position: absolute;
                z-index: -1;
                inset: 0 -1px -1px;
                border-radius: 0 0 999px 999px;
                background: #030303;
                box-shadow: inset 0 -1px 0 rgba(255,255,255,.08);
              }

              button:hover {
                border-color: rgba(255,255,255,1);
                box-shadow: 0 8px 24px rgba(0,0,0,.38), 0 1px 10px rgba(255,255,255,.2);
              }

              .wordmark { display: none; }
              /* Normal Windows bezel widget: same width, slim solid-black capsule, no face or eyes. */
              button { width: 260px; height: 17px; min-height:17px; padding:0; border:0; border-bottom:1px solid rgba(255,255,255,.12); border-radius:0 0 11px 11px; gap:0; background:#050505; box-shadow:0 3px 10px rgba(0,0,0,.32),inset 0 -1px rgba(255,255,255,.035); color:transparent; }
              button::before { display:none!important; content:none!important; }
              button:hover,button:focus-visible { border-color:rgba(255,255,255,.2); background:#080808; box-shadow:0 4px 12px rgba(0,0,0,.38); }
              .widget-eyes{display:none!important}
              svg,.wordmark{display:none!important;}

              button:hover {
                border-color: #fff;
              }

              button:focus-visible {
                outline: 2px solid #fff;
                outline-offset: 2px;
              }

              svg { display: none !important; }
            </style>
          </head>

          <body>
            <button
              aria-label="Open Bosley Companion"
              title="Open Bosley Companion"
            >
              <span class="widget-eyes" aria-hidden="true"><i></i><i></i></span>
              <span class="wordmark">BOSLEY</span>
            </button>

            <script>
              const button = document.querySelector('button');
              const sizes = {
                compact: { width: 220, height: 15 },
                default: { width: 260, height: 17 },
                wide: { width: 300, height: 19 }
              };
              function applyAppearance(value) {
                if (!value) return;
                const size = sizes[value.size] || sizes.default;
                document.documentElement.style.setProperty('--widget-radius',
                  ({ soft: '24px', balanced: '12px', sharp: '3px' })[value.edge] || '3px');
                document.documentElement.style.setProperty('--widget-border-width',
                  ({ thin: '1px', medium: '2px', bold: '3px' })[value.border] || '1px');
                button.style.width = size.width + 'px';
                button.style.height = size.height + 'px';
                const eyes=document.querySelector('.widget-eyes');
                if(eyes)eyes.style.display='none';
              }
              if (window.bosleyDesktop.onWidgetAppearance) {
                window.bosleyDesktop.onWidgetAppearance(applyAppearance);
              }
              // The top floating widget opens the Companion window.
              // The separate Writing & Ideas bulb is reserved for Ctrl+Shift+I only.
              document.querySelector('button').addEventListener('click', () => {
                window.bosleyDesktop.togglePanel();
              });
            </script>
          </body>
          </html>
          BUBBLE_EOF

      - name: Verify generated desktop bridge before packaging
        shell: bash
        run: |
          test -s desktop/main.cjs
          test -s desktop/preload.cjs
          test -s desktop/bubble.html
          grep -Fq 'function createWritingBulb()' desktop/main.cjs
          grep -Fq 'WINDOWS WRITING BULB VISIBLE' desktop/main.cjs
          grep -Fq 'openWritingAssistant: () => ipcRenderer.send' desktop/preload.cjs
          grep -Fq 'bosley:open-writing' desktop/main.cjs
          test -s desktop/companion.html
          test -s desktop/assets/companion.js
          test -s desktop/index.html
          test -d desktop/assets
          grep -q '<script' desktop/index.html
          grep -q '</html>' desktop/index.html
          grep -Fq 'id="startup-error"' desktop/index.html
          grep -Fq 'id="voicemodes"' desktop/index.html
          grep -Fq 'id="activitytoggle"' desktop/index.html
          grep -Fq 'function activityEvent' desktop/index.html
          grep -Fq 'function renderLocalMemories' desktop/index.html
          grep -Fq 'const outcome=await runWorkflow(saved)' desktop/index.html
          grep -Fq 'function setVoiceMode(next)' desktop/index.html
          grep -Fq 'aria-label="Open Bosley Companion"' desktop/bubble.html
          grep -Fq 'openRestoredUrl' desktop/main.cjs
          grep -Fq 'window-size=1100,760' desktop/main.cjs
          grep -Fq 'loadHostedFallback' desktop/main.cjs
          grep -Fq 'The local app opened but did not render its interface.' desktop/main.cjs
          grep -Fq './assets/supabase.js' desktop/index.html
          test -s desktop/assets/supabase.js
          grep -Fq "panel.loadFile(path.join(__dirname, 'index.html'))" desktop/main.cjs
          grep -Fq "bosley:capabilities" desktop/main.cjs
          grep -Fq "bosley:request" desktop/main.cjs
          grep -Fq "get_desktop_info" desktop/main.cjs
          grep -Fq "open_external_url" desktop/main.cjs
          grep -Fq "set_widget_appearance" desktop/main.cjs
          grep -Fq "launch_app" desktop/main.cjs
          grep -Fq "capture_screen" desktop/main.cjs
          grep -Fq 'id="targetContext"' desktop/main.cjs
          grep -Fq 'window.bosleySetTarget' desktop/main.cjs
          grep -Fq 'width: 340, height: 300' desktop/main.cjs
          grep -Fq "wake_companion" desktop/main.cjs
          grep -Fq "walking-companion.json" desktop/main.cjs
          grep -Fq "setWalkingCompanionEnabled" desktop/main.cjs
          grep -Fq "movable: true" desktop/main.cjs
          grep -Fq "loadFile(path.join(__dirname, 'companion.html'))" desktop/main.cjs
          grep -Fq 'aria-label="Bosley white ghost with blinking eyes and an animated speaking mouth"' desktop/companion.html
          grep -Fq 'id="ghost-mouth"' desktop/companion.html
          grep -Fq 'ghost-talk' desktop/companion.html
          grep -Fq 'ghost-blink' desktop/companion.html
          grep -Fq 'class="ghost-eye"' desktop/companion.html
          grep -Fq "onCompanionState" desktop/assets/companion.js
          ! grep -Fq "magnifying" desktop/assets/companion.js
          ! grep -Fq "badge" desktop/assets/companion.js
          grep -Fq "walkingCompanionPreference.x" desktop/main.cjs
          grep -Fq "onWidgetAppearance" desktop/preload.cjs
          grep -Fq "setCompanionState" desktop/preload.cjs
          grep -Fq "bosley:companion-state-update" desktop/main.cjs
          grep -Fq "contextIsolation: true" desktop/main.cjs
          grep -Fq "nodeIntegration: false" desktop/main.cjs
          grep -Fq "sandbox: true" desktop/main.cjs
          grep -Fq "getCapabilities" desktop/preload.cjs
          grep -Fq "contextBridge.exposeInMainWorld('BosleyDesktop'" desktop/preload.cjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          echo "Desktop bridge source and JavaScript syntax checks passed."

      - name: Generate Bosley app icon
        shell: bash
        run: |
          python -m pip install Pillow
          python scripts/generate-app-icons.py
          cp assets/icons/bosley.ico desktop/assets/bosley.ico

      - name: Install dependencies and build installer
        shell: bash
        run: |
          cd desktop
          npm install
          # Retry transient upstream HTTP 5xx failures from electron-builder's
          # Windows NSIS resource/signing download. Keep the build failure hard
          # if all attempts fail; never upload a partial installer.
          attempt=1
          until npm run dist; do
            if [ "$attempt" -ge 3 ]; then
              echo "Windows installer packaging failed after $attempt attempts."
              exit 1
            fi
            echo "Installer packaging failed (attempt $attempt); retrying in 15 seconds..."
            sleep 15
            attempt=$((attempt + 1))
          done

      - name: Verify Windows installer and unpacked executable
        shell: bash
        run: |
          test -d desktop/dist/win-unpacked
          test -s "desktop/dist/win-unpacked/Bosley Companion.exe"
          installer="$(find desktop/dist -maxdepth 1 -type f -name '*.exe' -size +1k -print -quit)"
          test -n "$installer"
          test -s "$installer"
          echo "Installer artifact verified: $installer"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Bosley-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Package optional Bosley Agent Pack
        shell: bash
        run: |
          test -s agent-pack/README.md
          test -s agent-pack/skills.json
          python - <<'PY'
          import json
          with open('agent-pack/skills.json', encoding='utf-8') as handle:
              pack = json.load(handle)
          assert isinstance(pack.get('version'), int) and pack.get('version') >= 1 and len(pack.get('skills', [])) >= 5
          with open('agent-pack/bosley-app.json', encoding='utf-8') as handle:
              app = json.load(handle)
          assert 'url' in app
          PY
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root = Path('agent-pack')
          with ZipFile('Bosley-Optional-Agent-Pack.zip', 'w', ZIP_DEFLATED) as archive:
              for file in sorted(root.rglob('*')):
                  if file.is_file():
                      archive.write(file, file.relative_to(root))
          print('Created Bosley-Optional-Agent-Pack.zip')
          PY

      - name: Upload optional agent pack
        uses: actions/upload-artifact@v4
        with:
          name: Bosley-Optional-Agent-Pack
          path: Bosley-Optional-Agent-Pack.zip
          if-no-files-found: error
          retention-days: 30
