<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030405"><title>Bosley Companion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{font-family:Manrope,system-ui,sans-serif;color:#e9edf5;background:#030405;--muted:#8793a7;--line:#24323c;--cyan:#42d9ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#0d415820,transparent 42%),#030405}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;place-items:center;padding:18px}.panel{width:min(100%,560px);height:min(900px,calc(100vh - 36px));min-height:580px;display:flex;flex-direction:column;border:1px solid #42d9ff30;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#0a0f14,#04070a);box-shadow:0 30px 100px #000b}.top{display:flex;align-items:center;gap:12px;padding:14px 17px;border-bottom:1px solid #ffffff12}.mascot{display:flex;align-items:center;justify-content:center;gap:8px;width:54px;height:40px;animation:float 4s ease-in-out infinite}.eye{display:block;width:13px;height:29px;border-radius:999px;background:#fff;box-shadow:0 0 14px #ffffff45}.eyes-launcher{display:flex;gap:14px;align-items:center;justify-content:center;width:110px;height:76px;margin:auto}.eyes-launcher .eye{width:20px;height:48px;box-shadow:0 0 24px #ffffff40}.quickbar{display:flex;gap:7px;margin:10px 14px 0}.quickbar button{flex:1;border:1px solid #42d9ff24;border-radius:9px;padding:8px 4px;background:#ffffff05;color:#c4d5e2;font-size:10px}.quickbar button:hover{background:#42d9ff12;border-color:#42d9ff66}.brand{flex:1}.brand strong{font-size:12px;letter-spacing:.14em}.brand small{display:block;margin-top:5px;color:#9aa8b8;font:10px 'DM Mono',monospace}.banner,.toggle{margin:12px 14px 0;padding:11px;border:1px solid #42d9ff25;border-radius:11px;background:#42d9ff08;font-size:11px}.banner small{display:block;color:#8d9baa;margin-top:3px}.pill{float:right;color:#83e8d2;font:9px 'DM Mono',monospace}.toggle{width:calc(100% - 28px);text-align:left;color:#cbeefa;cursor:pointer}.toggle span{float:right;color:#69899a;font:8px 'DM Mono',monospace}.workspace{margin:8px 14px 0;padding:12px;border:1px solid #42d9ff2b;border-radius:12px;background:#02070a;overflow:auto;max-height:45%;font-size:11px}.workspace h3{margin:0 0 5px;font-size:12px}.muted{color:#91a1af;font-size:10px;line-height:1.6}.tabs{display:flex;gap:6px;margin:10px 0}.tabs button{flex:1;padding:7px;border:1px solid #24323c;border-radius:7px;background:transparent;color:#9ba9b8}.tabs .active{border-color:#42d9ff66;background:#42d9ff14;color:#cbeefa}.form{display:grid;gap:7px;margin-top:8px}.form input,.form textarea,.form select{width:100%;min-width:0;padding:9px 10px;border:1px solid #91b0c52b;border-radius:8px;outline:0;background:#080d11;color:#e8f1f8;font-size:11px}.form textarea{min-height:48px}.fields{display:flex;gap:7px}.fields>*{flex:1}.primary{padding:9px;border:0;border-radius:8px;background:linear-gradient(135deg,#8deaff,#43bfff);color:#061016;font-size:11px;font-weight:800}.link{border:0;background:none;color:#73dcf6;font-size:10px;padding:8px 0}.feedback{font-size:10px;line-height:1.5;margin:7px 0}.error{color:#ff9d9d}.success{color:#8ce7c6}.items{display:grid;gap:7px;margin-top:10px}.item{display:flex;align-items:flex-start;gap:8px;padding:9px;border:1px solid #91b0c51c;border-radius:8px}.item main{flex:1;min-width:0}.item strong{font-size:11px;overflow-wrap:anywhere}.item p{margin:5px 0;color:#a2b0bc;font-size:10px;white-space:pre-wrap;overflow-wrap:anywhere}.item small{color:#6d8798;font:8px 'DM Mono',monospace}.item button{border:1px solid #91b0c526;border-radius:6px;background:transparent;color:#8ca0b0}.item.done strong{text-decoration:line-through;color:#7b8a96}.chat{flex:1;min-height:0;overflow:auto;padding:17px}.day{text-align:center;color:#5f6e7c;font:9px 'DM Mono',monospace;margin:4px 0 22px}.msg{margin-bottom:18px;font-size:12px;line-height:1.7;overflow-wrap:anywhere}.msg b{display:block;color:#7edfff;font:9px 'DM Mono',monospace;margin-bottom:5px}.msg.you{text-align:right}.msg.you p{display:inline-block;text-align:left;padding:9px 12px;border:1px solid #42d9ff24;border-radius:12px 4px 12px 12px;background:#42d9ff0b}.msg p{margin:0;color:#d5dce5}.composer{display:flex;gap:8px;margin:0 14px;padding:7px;border:1px solid #91b0c52b;border-radius:13px}.composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:#fff;font-size:12px}.composer button{border:0;border-radius:8px;padding:8px;background:#42d9ff;color:#041016}.bottom{display:flex;justify-content:space-between;padding:13px 17px;color:#657484;font:9px 'DM Mono',monospace}.bottom button{border:0;background:transparent;color:#91a0ae;font:9px 'DM Mono',monospace}.foot{text-align:center;color:#4c5b68;font:9px 'DM Mono',monospace;padding:0 0 14px}.stage{min-height:100vh;display:grid;place-content:center;text-align:center;gap:15px}.stage button{font-size:78px;border:1px solid #42d9ff44;border-radius:35px;background:#0b151b;padding:25px}.stage small{color:#91a1af;font:10px 'DM Mono',monospace}@keyframes float{50%{transform:translateY(-4px) rotate(2deg)}}@media(max-width:520px){.shell{padding:0}.panel{width:100%;height:100dvh;min-height:540px;border-radius:0}.workspace{max-height:42dvh}.foot{display:none}}
</style></head><body><div id="root"></div>
<!-- Set only the public anon/publishable key. Never put a service-role key or other secret in this file. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://ywwfqisbmlkjcfoqehph.supabase.co";
const SUPABASE_PUBLIC_KEY="PASTE_YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY_HERE";
(()=>{
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const configured=!!(window.supabase&&SUPABASE_PUBLIC_KEY&&!SUPABASE_PUBLIC_KEY.startsWith("PASTE_"));
const db=configured?window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}):null;
let user=null, tab="tasks",notes=[],tasks=[],workspaceOpen=false,authMode="signin",speechOn=true,listening=false,recognition=null,messages=[{role:"bosley",text:"Hey! I'm Bosley. This browser companion is running in local demo mode. AI is not connected, but you can test the interface and spoken replies."}];
function feedback(text,error=false){let e=$("#feedback");if(e){e.textContent=text;e.className="feedback "+(error?"error":"success")}}
function workspace(){
if(!configured)return `<h3>Connect to Jarvis <span class="pill">SETUP NEEDED</span></h3><p class="muted">Add your Supabase public anon/publishable key near the top of this HTML file, then refresh. Never use a service-role key here.</p>`;
if(!user)return `<h3>Connect to Jarvis <span class="pill">SUPABASE AUTH</span></h3><p class="muted">Sign in to access your private notes and tasks.</p><form class="form" id="auth"><input id="email" type="email" required autocomplete="email" placeholder="Email address"><input id="password" type="password" minlength="8" required autocomplete="${authMode==="signup"?"new-password":"current-password"}" placeholder="Password (8+ characters)"><button class="primary">${authMode==="signup"?"Create account":"Sign in"}</button></form><button class="link" id="switch">${authMode==="signin"?"New here? Create an account":"Already registered? Sign in"}</button><div id="feedback" class="feedback"></div>`;
let arr=tab==="tasks"?tasks:notes;
return `<h3>Jarvis Workspace <span class="pill">SIGNED IN</span></h3><div class="muted">${esc(user.email)} <button id="refresh">Refresh</button> <button id="logout">Sign out</button></div><div class="tabs"><button data-tab="tasks" class="${tab==="tasks"?"active":""}">Tasks (${tasks.length})</button><button data-tab="notes" class="${tab==="notes"?"active":""}">Notes (${notes.length})</button></div><form id="itemform" class="form"><input id="title" required maxlength="160" placeholder="${tab==="notes"?"Note title…":"What needs doing?"}"><textarea id="content" maxlength="20000" placeholder="${tab==="notes"?"Write your note…":"Details (optional)"}"></textarea>${tab==="tasks"?'<div class="fields"><input id="due" type="datetime-local" aria-label="Due date"><select id="priority"><option value="low">Low priority</option><option value="medium" selected>Medium priority</option><option value="high">High priority</option></select></div>':""}<button class="primary">Save ${tab==="notes"?"note":"task"}</button></form><div id="feedback" class="feedback"></div><div class="items">${arr.map(x=>tab==="tasks"?`<article class="item ${x.status==="completed"?"done":""}"><button data-toggle="${esc(x.id)}">${x.status==="completed"?"✓":"○"}</button><main><strong>${esc(x.title)}</strong>${x.notes?`<p>${esc(x.notes)}</p>`:""}<small>${esc((x.priority||"medium").toUpperCase())}${x.due_at?" · DUE "+esc(new Date(x.due_at).toLocaleString()):""}</small></main><button data-delete="${esc(x.id)}">×</button></article>`:`<article class="item"><main><strong>${esc(x.title)}</strong><p>${esc(x.content||"No content")}</p><small>UPDATED ${esc(x.updated_at?new Date(x.updated_at).toLocaleString():"")}</small></main><button data-delete="${esc(x.id)}">×</button></article>`).join("")||`<p class="muted">No ${tab} yet. Add the first one above.</p>`}</div>`;
}
function render(){
$("#root").innerHTML=`<div class="shell"><section class="panel"><header class="top"><span class="mascot" aria-label="Bosley eyes"><i class="eye"></i><i class="eye"></i></span><div class="brand"><strong>BOSLEY COMPANION</strong><small>● READY &nbsp; <span style="color:#65dfff">LOCAL UI</span></small></div><button id="collapse" title="Collapse">−</button></header><div class="banner"><b>● Bosley is ready</b><span class="pill">LOCAL MODE</span><small>Voice interface is available. AI and device control remain disconnected until safely configured.</small></div><div class="quickbar"><button id="quickchat">✦ Chat</button><button id="quicktasks">✓ Tasks</button><button id="quicknotes">▤ Notes</button><button id="quickvoice">◖ Voice</button></div><button class="toggle" id="toggle">▤ &nbsp; <b>${workspaceOpen?"Hide":"Open"} Jarvis Workspace</b><span>NOTES · TASKS · SYNC</span></button>${workspaceOpen?`<section class="workspace">${workspace()}</section>`:""}<section class="chat" id="chat"><div class="day">— SESSION STARTED —</div>${messages.map(m=>`<article class="msg ${m.role==="you"?"you":""}"><b>${m.role==="you"?"YOU":"BOSLEY"}</b><p>${esc(m.text)}</p></article>`).join("")}</section><form class="composer" id="chatform"><button type="button" id="mic" title="Voice input">${listening?"■":"🎙"}</button><input id="chatinput" placeholder="Message Bosley…" autocomplete="off"><button id="send">➤</button></form><footer class="bottom"><span>CTRL/ALT + SHIFT + B · TOGGLE</span><button id="voice">VOICE ${speechOn?"ON":"OFF"}</button></footer></section><div class="foot">BOSLEY COMPANION · AI NOT CONNECTED · SINGLE-FILE EDITION</div></div>`;
$("#toggle").onclick=async()=>{workspaceOpen=!workspaceOpen;render();if(workspaceOpen&&user)await load()};
$("#quickchat").onclick=()=>$("#chatinput")?.focus();
$("#quicktasks").onclick=()=>{workspaceOpen=true;tab="tasks";render();if(user)load()};
$("#quicknotes").onclick=()=>{workspaceOpen=true;tab="notes";render();if(user)load()};
$("#quickvoice").onclick=()=>{speechOn=!speechOn;if(!speechOn&&"speechSynthesis"in window)speechSynthesis.cancel();render()};
$("#collapse").onclick=()=>{$("#root").innerHTML=`<main class="stage"><button id="restore" aria-label="Open Bosley">✏️</button><small>BOSLEY · TAP PENCIL TO OPEN</small></main>`;$("#restore").onclick=render};
$("#chatform").onsubmit=e=>{e.preventDefault();let i=$("#chatinput"),t=i.value.trim();if(!t)return;messages.push({role:"you",text:t},{role:"bosley",text:"I received your message, but AI is not connected yet. This message has not been sent to an AI service."});render();if(speechOn&&"speechSynthesis"in window){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(messages[messages.length-1].text))}};
$("#voice").onclick=()=>{speechOn=!speechOn;if(!speechOn&&"speechSynthesis"in window)speechSynthesis.cancel();render()};
$("#mic").onclick=()=>listening?stopMic():startMic();
if(workspaceOpen)bindWorkspace();
}
async function load(){if(!db||!user)return;try{const [n,t]=await Promise.all([db.from("eng_notes").select("id,title,content,tags,updated_at").order("updated_at",{ascending:false}),db.from("tasks").select("id,title,notes,due_at,priority,status,completed_at,created_at").order("created_at",{ascending:false})]);if(n.error)throw Error("Notes: "+n.error.message);if(t.error)throw Error("Tasks: "+t.error.message);notes=n.data||[];tasks=t.data||[];render();feedback("Synced with your Jarvis Supabase account.")}catch(e){render();feedback(e.message||"Sync failed",true)}}
function bindWorkspace(){
if(!configured)return;
if(!user){$("#switch").onclick=()=>{authMode=authMode==="signin"?"signup":"signin";render()};$("#auth").onsubmit=async e=>{e.preventDefault();feedback("Working…");try{let r=authMode==="signup"?await db.auth.signUp({email:$("#email").value.trim(),password:$("#password").value}):await db.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});if(r.error)throw r.error;if(authMode==="signup"&&!r.data.session){feedback("Account created. Check your email to confirm, then sign in.");return}user=r.data.user;await load();render()}catch(err){feedback(err.message,true)}};return}
$("#refresh").onclick=load;$("#logout").onclick=async()=>{const {error}=await db.auth.signOut();if(error){feedback(error.message,true);return}user=null;notes=[];tasks=[];render()};
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
$("#itemform").onsubmit=async e=>{e.preventDefault();let title=$("#title").value.trim(),content=$("#content").value.trim();if(!title)return;feedback("Saving…");try{let r=tab==="notes"?await db.from("eng_notes").insert({user_id:user.id,title,content,tags:[]}):await db.from("tasks").insert({user_id:user.id,title,notes:content||null,due_at:$("#due").value?new Date($("#due").value).toISOString():null,priority:$("#priority").value,status:"open",completed_at:null});if(r.error)throw r.error;await load()}catch(err){feedback(err.message,true)}};
document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=async()=>{let t=tasks.find(x=>x.id===b.dataset.toggle);if(!t)return;let done=t.status!=="completed";let {error}=await db.from("tasks").update({status:done?"completed":"open",completed_at:done?new Date().toISOString():null}).eq("id",t.id).eq("user_id",user.id);if(error)feedback(error.message,true);else await load()});
document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=async()=>{let {error}=await db.from(tab==="notes"?"eng_notes":"tasks").delete().eq("id",b.dataset.delete).eq("user_id",user.id);if(error)feedback(error.message,true);else await load()});
}
function startMic(){let C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C){alert("Speech recognition is not supported in this browser. You can type instead.");return}try{recognition=new C();recognition.lang=navigator.language||"en-US";recognition.interimResults=false;recognition.onresult=e=>{$("#chatinput").value=e.results[0][0].transcript};recognition.onerror=e=>alert(e.error==="not-allowed"?"Microphone permission denied.":"Microphone issue. You can type instead.");recognition.onend=()=>{listening=false;let b=$("#mic");if(b)b.textContent="🎙"};recognition.start();listening=true;$("#mic").textContent="■"}catch{alert("Could not start microphone. Check browser permissions.")}}
function stopMic(){recognition?.stop();recognition=null;listening=false;if($("#mic"))$("#mic").textContent="🎙"}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.altKey)&&e.shiftKey&&e.key.toLowerCase()==="b"){e.preventDefault();if($("#restore"))render();else $("#collapse")?.click()}if(e.key==="Escape"&&listening)stopMic()});
render();
if(db){db.auth.getSession().then(({data})=>{user=data.session?.user||null;render()});db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(workspaceOpen){if(user)load();else{notes=[];tasks=[];render()}}})}
})();
</script></body></html>
